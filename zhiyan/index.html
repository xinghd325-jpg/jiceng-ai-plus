:400\" onclick=\"closeMo('mo-viewrule')\">✕<\/span><\/div>\n  <div class=\"modal-bd\" id=\"vr-body\"><\/div>\n  <div class=\"modal-ft\"><button class=\"btn\" onclick=\"closeMo('mo-viewrule')\">关闭<\/button><button class=\"btn-primary\" id=\"vr-edit-btn\" onclick=\"editFromView()\">编辑<\/button><\/div>\n<\/div><\/div>\n<div class=\"modal-mask\" id=\"mo-addkw\"><div class=\"modal-box\" style=\"width:480px\">\n  <div class=\"modal-hd\">新增关键词 <span style=\"cursor:pointer;font-weight:400\" onclick=\"closeMo('mo-addkw')\">✕<\/span><\/div>\n  <div class=\"modal-bd\">\n    <div style=\"margin-bottom:12px\"><label>关键词<\/label><input id=\"kw-new-word\" style=\"width:100%;height:36px;margin-top:6px;border:1px solid var(--bd);border-radius:4px;padding:0 10px\" placeholder=\"如：集体停运\"><\/div>\n    <div style=\"margin-bottom:12px\"><label>所属词库<\/label>\n      <select id=\"kw-new-lib\" style=\"width:100%;height:36px;margin-top:6px;border:1px solid var(--bd);border-radius:4px\"><option value=\"custom\">自定义词库<\/option><option value=\"high\">高风险词库<\/option><option value=\"extreme\">极端行为词库<\/option><\/select>\n    <\/div>\n    <div><label>命中触发等级<\/label>\n      <select id=\"kw-new-level\" style=\"width:100%;height:36px;margin-top:6px;border:1px solid var(--bd);border-radius:4px\"><option>高风险<\/option><option selected>中风险<\/option><\/select>\n    <\/div>\n  <\/div>\n  <div class=\"modal-ft\"><button class=\"btn\" onclick=\"closeMo('mo-addkw')\">取消<\/button><button class=\"btn-primary\" onclick=\"submitKw()\">保存<\/button><\/div>\n<\/div><\/div>\n\n<script>\nvar AREAS=['婺城区','金东区','义乌市','东阳市','永康市','兰溪市','武义县','浦江县','磐安县'];\nvar mockWarn=[\n  {id:'W0703-001',tp:'高风险词',title:'高风险关键词命中预警',desc:'事件 EVT20260703008「网约车司机投诉平台抽成比例过高」描述含「集体停运」「讨说法」，当事人王浩然情绪激烈，同站点已有多人跟帖。',lv:'h',lvt:'高风险',area:'婺城区',ago:'2026-07-03 11:50',st:'待处理',case:'EVT20260703008'},\n  {id:'W0703-002',tp:'主体',title:'高风险主体行为预警',desc:'即时配送人员杨磊近 30 天已触发 3 次工伤理赔类预警，本次事件 EVT20260703023 再次反映理赔困难，风险持续偏高。',lv:'h',lvt:'高风险',area:'婺城区',ago:'2026-07-03 08:10',st:'待处理',case:'EVT20260703023'},\n  {id:'W0703-003',tp:'重复投诉',title:'重复投诉预警',desc:'张建国 30 天内第 4 次反映小区禁停导致快递配送困难（EVT20260703001），历次均未彻底解决，判定为反复诉求。',lv:'h',lvt:'高风险',area:'婺城区',ago:'2026-07-03 13:40',st:'待处理',case:'EVT20260703001'},\n  {id:'W0703-004',tp:'聚集',title:'区域诉求聚集预警',desc:'金东区多湖街道近 7 天新增即时配送通行、出餐纠纷 6 件，语义高度关联，疑似同一路段施工影响集中爆发。',lv:'h',lvt:'高风险',area:'金东区',ago:'2026-07-03 12:20',st:'已知悉',case:'',resp:0.8},\n  {id:'W0703-005',tp:'趋势',title:'劳动权益保障趋势突增预警',desc:'金华市本周新就业群体劳动权益保障事件 38 件，较近 4 周均值（16 件）突增 137%，主要集中在网约车、即时配送与货运挂靠。',lv:'h',lvt:'高风险',area:'金华市',ago:'2026-07-03 09:05',st:'待处理',case:''},\n  {id:'W0702-006',tp:'超时',title:'超时未处置预警（7日）',desc:'事件 EVT20260703018「网约车账号被封禁申诉无门」已超时 7 个工作日未办结，承办：婺城区网信办。',lv:'m',lvt:'中风险',area:'婺城区',ago:'2026-07-02 16:20',st:'已知悉',case:'EVT20260703018',resp:1.5},\n  {id:'W0702-007',tp:'超时',title:'超时未处置预警（5日）',desc:'事件 EVT20260703016「快递配送超时 3 天未送达」已超时 5 个工作日，请尽快推进。',lv:'m',lvt:'中风险',area:'婺城区',ago:'2026-07-02 10:15',st:'待处理',case:'EVT20260703016'},\n  {id:'W0701-008',tp:'重复投诉',title:'重复投诉预警（第 3 次）',desc:'钱大伟 30 天内第 3 次反映出租车份子钱过重（东阳市），建议交通运输部门约谈企业并统一口径。',lv:'m',lvt:'中风险',area:'东阳市',ago:'2026-07-01 15:40',st:'已知悉',case:'EVT20260703012',resp:2.2},\n  {id:'W0630-009',tp:'超时',title:'超时未处置预警（已办结回写）',desc:'事件 EVT20260703015「快递站点周边垃圾堆积」曾超时 5 日，现已办结。',lv:'l',lvt:'低风险',area:'浦江县',ago:'2026-06-30 11:20',st:'已处置',case:'EVT20260703015',resp:3.0},\n  {id:'W0630-010',tp:'趋势',title:'平台抽成类波动观察',desc:'全市网约车、货运平台抽成类事件近一周 22 件，高于均值但未超阈值，系统标注为观察。',lv:'l',lvt:'低风险',area:'金华市',ago:'2026-06-30 09:00',st:'已处置',case:'',resp:1.6}\n];\nvar mockRules=[\n  {name:'超时处置预警',tp:'超时预警',cond:'当事项未办结超过 7 个工作日时，触发中风险；之后每隔 5 个工作日重复提醒',lv:'中风险',cnt:18,on:true,scope:'金华市',params:{status:'未办结',days:7,level:'中风险',repeat:true,interval:5}},\n  {name:'重复投诉预警',tp:'重复投诉',cond:'当同一当事人在 30 天内，针对同一事件类型上报次数 ≥ 3 次时，触发高风险',lv:'高风险',cnt:9,on:true,scope:'金华市',params:{days:30,type:'同一事件类型',op:'≥',cnt:3,level:'高风险'}},\n  {name:'高风险关键词命中',tp:'关键词命中',cond:'当事件描述命中词库「高风险词库」且命中数量 ≥ 1 个时，触发高风险',lv:'高风险',cnt:8,on:true,scope:'金华市',params:{lib:'高风险词库',op:'≥',cnt:1,level:'高风险'}},\n  {name:'趋势突增预警',tp:'趋势预警',cond:'当某类新就业主题本周数量相比近 4 周均值环比增长 ≥ 50%，且超过近四周标准差的 2 倍时，触发中风险',lv:'中风险',cnt:5,on:true,scope:'金华市',params:{window:4,op:'≥',pct:50,sigma:2,level:'中风险'}},\n  {name:'区域聚集苗头预警',tp:'聚合预警',cond:'当同一区县在 7 天内新增事件 ≥ 3 件，且语义相似度 ≥ 70% 时，触发高风险',lv:'高风险',cnt:3,on:true,scope:'金华市',params:{scope:'区县',days:7,op:'≥',cnt:3,sim:70,level:'高风险'}},\n  {name:'主体风险画像联动',tp:'主体风险',cond:'当同一当事人在全部历史累计触发预警 ≥ 3 次，且近 30 天有新增事件时，触发中风险',lv:'中风险',cnt:2,on:true,scope:'金华市',params:{window:'全部历史',op:'≥',cnt:3,days:30,level:'中风险'}},\n  {name:'长期未结督办',tp:'超时预警',cond:'当事项未办结超过 30 个工作日时，触发高风险；之后每隔 5 个工作日重复提醒',lv:'高风险',cnt:2,on:true,scope:'金华市',params:{status:'未办结',days:30,level:'高风险',repeat:true,interval:5}},\n  {name:'重点时段敏感预警',tp:'时段预警',cond:'当处于法定节假日前后前 3 天至期间结束，且新增事件命中高风险关键词时，触发中风险',lv:'中风险',cnt:0,on:false,scope:'金华市',params:{period:'法定节假日前后',days:3,cond:'命中高风险关键词',level:'中风险'}}\n];\nvar KW={\n  high:['集体停运','讨说法','曝光平台','罢工','维权','投诉无门','不肯干了','讨薪','欠薪','封号','扣罚过严','强制停运'],\n  extreme:['集体上访','聚集维权','堵路','围堵网点','直播曝光','鱼死网破'],\n  custom:[]\n};\nvar kwLib='high';\nvar handleIdx=-1, assignIdx=-1;\nvar NAMES=['预警消息中心','预警态势分析','预警规则配置','关键词库管理'];\n\nfunction toast(msg){\n  var box=document.getElementById('toastContainer');\n  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; box.appendChild(t);\n  setTimeout(function(){t.remove()},2200);\n}\nfunction openMo(id){document.getElementById(id).classList.add('show')}\nfunction closeMo(id){document.getElementById(id).classList.remove('show')}\nfunction switchWarn(idx){\n  document.querySelectorAll('#warn-sub-menu .sub-item').forEach(function(el,i){el.classList.toggle('on',i===idx)});\n  for(var i=0;i<4;i++){var el=document.getElementById('tab'+i); if(el) el.style.display=i===idx?'block':'none'}\n  document.getElementById('bcName').textContent=NAMES[idx];\n  if(idx===0) applyWarnFilter(false);\n  if(idx===1) renderTrend();\n  if(idx===2) renderRules();\n  if(idx===3) renderKw();\n  try{ history.replaceState(null,'','#'+idx); }catch(e){}\n}\nfunction renderWarn(list){\n  var el=document.getElementById('warnCards');\n  var data=list||mockWarn;\n  if(!data.length){el.innerHTML='<div class=\"card\" style=\"text-align:center;color:var(--tx3)\">暂无符合条件的预警<\/div>';return;}\n  el.innerHTML=data.map(function(w,idx){\n    var real=mockWarn.indexOf(w);\n    if(real<0) real=idx;\n    var ops='';\n    if(w.st==='待处理') ops='<button class=\"btn-primary\" onclick=\"openHandle('+real+')\">处置<\/button><button class=\"btn\" onclick=\"openAssign('+real+')\">指派<\/button><button class=\"btn\" onclick=\"ackWarn('+real+')\">知悉<\/button>'+(w.case?'<span class=\"lbtn\" onclick=\"toast(\\'关联事件 '+w.case+'\\')\">查看事件<\/span>':'');\n    else if(w.st==='已知悉') ops='<span style=\"color:var(--info);font-size:12px\">已知悉<\/span>'+(w.case?'<span class=\"lbtn\" onclick=\"toast(\\'关联事件 '+w.case+'\\')\">查看事件<\/span>':'');\n    else ops='<span style=\"color:var(--success);font-size:12px\">已处置<\/span>';\n    return '<div class=\"warn-card lv-'+w.lv+'\"><div class=\"warn-hd\"><span class=\"tag tag-'+w.lv[0]+'\">'+w.lvt+'<\/span><span class=\"tag\">'+w.tp+'<\/span><span style=\"font-size:12px;color:var(--tx3)\">'+w.area+'<\/span>'+(w.case?'<span class=\"lbtn\" style=\"font-size:12px\">'+w.case+'<\/span>':'')+'<span style=\"margin-left:auto;font-size:12px;color:var(--tx3)\">'+w.ago+'<\/span><span class=\"tag tag-st-'+(w.st==='待处理'?'wait':w.st==='已知悉'?'ack':'done')+'\" style=\"padding:1px 8px;border-radius:3px;font-size:12px\">'+w.st+'<\/span><\/div><div class=\"warn-title\">'+w.title+'<\/div><div class=\"warn-desc\">'+w.desc+'<\/div><div class=\"warn-ops\">'+ops+'<\/div><\/div>';\n  }).join('');\n}\nvar WARN_TODAY='2026-07-03';\nfunction warnRange(){\n  var mode=document.getElementById('flt-time').value;\n  if(mode==='day') return [WARN_TODAY, WARN_TODAY];\n  if(mode==='month') return [WARN_TODAY.slice(0,8)+'01', WARN_TODAY];\n  if(mode==='year') return [WARN_TODAY.slice(0,4)+'-01-01', WARN_TODAY];\n  var a=document.getElementById('flt-from').value||'2000-01-01';\n  var b=document.getElementById('flt-to').value||'2099-12-31';\n  if(a>b){ var t=a; a=b; b=t; }\n  return [a,b];\n}\nfunction warnInRange(w){\n  var d=String(w.ago).slice(0,10);\n  var r=warnRange();\n  return d>=r[0] && d<=r[1];\n}\nfunction renderWarnKpi(list){\n  var pending=0, done=0, hi=0, mid=0, low=0, sum=0, n=0;\n  list.forEach(function(w){\n    if(w.st==='待处理') pending++; else done++;\n    if(w.lv==='h') hi++; else if(w.lv==='m') mid++; else low++;\n    if(w.st!=='待处理' && typeof w.resp==='number'){ sum+=w.resp; n++; }\n  });\n  var avg=n ? (Math.round(sum/n*10)/10).toFixed(1)+'<em>h<\/em>' : '—';\n  function card(label, val, danger){\n    return '<div class=\"kpi\"><div class=\"k-label\">'+label+'<\/div><div class=\"k-val'+(danger?' danger':'')+'\">'+val+'<\/div><\/div>';\n  }\n  document.getElementById('warnKpis').innerHTML=\n    card('待处理预警', pending, true)+\n    card('已处理预警', done)+\n    card('平均响应时间', avg)+\n    card('高风险预警', hi)+\n    card('中风险预警', mid)+\n    card('低风险预警', low);\n}\nfunction onWarnTime(){\n  document.getElementById('warnCustom').hidden=document.getElementById('flt-time').value!=='custom';\n  applyWarnFilter(false);\n}\nfunction applyWarnFilter(showToast){\n  var ranged=mockWarn.filter(warnInRange);\n  renderWarnKpi(ranged);\n  var lv=document.getElementById('flt-lv').value;\n  var tp=document.getElementById('flt-tp').value;\n  var st=document.getElementById('flt-st').value;\n  var area=document.getElementById('flt-area').value;\n  var list=ranged.filter(function(w){\n    return (!lv||w.lvt===lv)&&(!tp||w.tp===tp)&&(!st||w.st===st)&&(!area||w.area===area||w.area==='金华市');\n  });\n  renderWarn(list);\n  if(showToast) toast('已筛选：共 '+list.length+' 条');\n}\nfunction filterWarn(){ applyWarnFilter(true); }\nfunction bindFsel(){\n  document.querySelectorAll('.fsel').forEach(function(box){\n    var btn=box.querySelector('.fsel-btn');\n    var hid=box.querySelector('input[type=\"hidden\"]');\n    btn.addEventListener('click', function(e){\n      e.stopPropagation();\n      var open=box.classList.contains('open');\n      document.querySelectorAll('.fsel.open').forEach(function(b){ b.classList.remove('open'); });\n      if(!open) box.classList.add('open');\n    });\n    box.querySelectorAll('.fsel-opt').forEach(function(opt){\n      opt.addEventListener('click', function(e){\n        e.stopPropagation();\n        hid.value=opt.getAttribute('data-v');\n        btn.textContent=opt.textContent;\n        box.querySelectorAll('.fsel-opt').forEach(function(o){ o.classList.toggle('on', o===opt); });\n        box.classList.remove('open');\n        if(hid.id==='flt-time') onWarnTime();\n        else filterWarn();\n      });\n    });\n  });\n  document.addEventListener('click', function(){\n    document.querySelectorAll('.fsel.open').forEach(function(b){ b.classList.remove('open'); });\n  });\n}\nfunction markResp(w){ if(typeof w.resp!=='number') w.resp=0.5; }\nfunction exportWarn(){toast('已导出预警列表')}\nfunction ackWarn(i){mockWarn[i].st='已知悉';markResp(mockWarn[i]);applyWarnFilter(false);toast('已知悉')}\nfunction openHandle(i){handleIdx=i;var w=mockWarn[i];document.getElementById('handleBody').innerHTML='<div style=\"margin-bottom:10px;font-weight:600\">'+w.title+'<\/div><div style=\"font-size:13px;color:var(--tx2);margin-bottom:12px\">'+w.desc+'<\/div><label>处置说明<\/label><textarea id=\"handleNote\" rows=\"4\" style=\"width:100%;margin-top:6px;border:1px solid var(--bd);border-radius:4px;padding:8px\" placeholder=\"请填写处置措施\"><\/textarea>';openMo('mo-handle')}\nfunction submitHandle(){if(handleIdx>=0){mockWarn[handleIdx].st='已处置';markResp(mockWarn[handleIdx]);}closeMo('mo-handle');applyWarnFilter(false);toast('已提交处置')}\nfunction openAssign(i){assignIdx=i;openMo('mo-assign')}\nfunction submitAssign(){closeMo('mo-assign');toast('已指派至 '+document.getElementById('assignDept'

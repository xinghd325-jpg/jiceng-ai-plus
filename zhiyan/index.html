>图片占位<\/span><\/div>';\n}\nfunction previewAttach(src){\n  if(!src){showToast('演示占位图','info');return;}\n  var m=document.getElementById('attachPreview');\n  if(!m){\n    m=document.createElement('div');\n    m.id='attachPreview';\n    m.className='attach-preview';\n    m.onclick=function(){m.classList.remove('show');};\n    m.innerHTML='<img alt=\"附件预览\">';\n    document.body.appendChild(m);\n  }\n  m.querySelector('img').src=src;\n  m.classList.add('show');\n}\nfunction renderAttachCards(list){\n  if(!list||!list.length) return '<div class=\"attach-empty\">暂无附件<\/div>';\n  var h='<div class=\"attach-grid\">';\n  list.forEach(function(a){\n    if(a.placeholder){\n      h+='<div class=\"attach-card\" onclick=\"previewAttach(\\'\\')\">'+attachPhHtml()+'<div class=\"nm\">'+a.name+'<\/div><\/div>';\n    }else{\n      var src=a.src||'';\n      h+='<div class=\"attach-card\" onclick=\"previewAttach(\\''+src.replace(/'/g,'\\\\\\'')+'\\')\"><img src=\"'+src+'\" alt=\"'+a.name+'\"><div class=\"nm\">'+a.name+'<\/div><\/div>';\n    }\n  });\n  return h+'<\/div>';\n}\n\n// ===== 右侧 - 事件附件 =====\nfunction renderRightAttach(ev){\n  fillClosedAttachments(ev);\n  ensurePrePlaceholders(ev);\n  var h='<div class=\"attach-wrap\">';\n  h+='<div class=\"attach-sec\"><div class=\"attach-hd\"><span class=\"t\">处理前<\/span><span class=\"n\">共'+(ev.preAttachCount||(ev.preAttachments&&ev.preAttachments.length)||0)+'份附件<\/span><\/div>'+renderAttachCards(ev.preAttachments)+'<\/div>';\n  h+='<div class=\"attach-sec\"><div class=\"attach-hd\"><span class=\"t\">处理中<\/span><span class=\"n\">共'+(ev.midAttachCount||(ev.midAttachments&&ev.midAttachments.length)||0)+'份附件<\/span><\/div>'+renderAttachCards(ev.midAttachments)+'<\/div>';\n  h+='<div class=\"attach-sec\"><div class=\"attach-hd\"><span class=\"t\">处理后<\/span><span class=\"n\">共'+(ev.postAttachCount||(ev.postAttachments&&ev.postAttachments.length)||0)+'份附件<\/span><\/div>'+renderAttachCards(ev.postAttachments)+'<\/div>';\n  h+='<\/div>';\n  document.getElementById('rightPane1').innerHTML=h;\n}\n\n// ===== 右侧 - AI分析 =====\nfunction enrichAIContent(ev){\n  if(!ev) return ev;\n  var isKey = !!(ev.category && ev.category.indexOf('重点事件')===0) || !!(ev.type && String(ev.type).indexOf('重点')>=0);\n  var isUrgent = !!(ev.category && ev.category.indexOf('紧急')>=0) || !!(ev.type && String(ev.type).indexOf('紧急')>=0);\n  var isSensitive = !!(ev.category && ev.category.indexOf('敏感')>=0) || !!(ev.type && String(ev.type).indexOf('敏感')>=0);\n  var isCross = !!(ev.category && ev.category.indexOf('多跨')>=0) || !!(ev.type && String(ev.type).indexOf('多跨')>=0);\n  var group = ev.group || ev.groups || '新就业群体';\n  var desc = ev.desc || ev.title || '该事件';\n  var cat = ev.category || ev.type || '一般事件';\n  var tag = ev.aiTag || '';\n  var org = ev.org || '主责部门';\n\n  // —— 风险研判：至少三维 ——\n  var risks = (ev.riskItems || []).slice();\n  var needExpandRisk = risks.length < 2 || risks.every(function(r){ return !r.text || r.text.length < 40; });\n  if(needExpandRisk){\n    risks = [];\n    if(isUrgent){\n      risks.push({level:'高风险·时效紧迫',cls:'high',title:'人身/财产安全与响应时效',text:'事件描述「'+desc+'」具有即时响应特征。若未在黄金处置窗口内完成现场稳控与伤情/财产核实，易造成次生伤害，并触发上级督办。建议按紧急事件标准启动首接责任制，1小时内反馈初核情况。'});\n    } else if(isSensitive || isKey){\n      risks.push({level:'高风险·舆情敏感',cls:'high',title:'舆情外溢与群体关注',text:'涉及「'+group+'」切身利益，主题「'+ (tag||'权益保障') +'」在同类事件中关注度较高。历史相似事件显示，若回应滞后或口径不一，易在社群、短视频平台发酵，形成区域性负面舆情。建议同步启动舆情监测，明确对外口径。'});\n    } else {\n      risks.push({level:'低风险·影响可控',cls:'low',title:'影响范围评估',text:'当前信息显示该事项主要为个案诉求，尚未出现多人联名、集体聚集或跨区域扩散迹象。在按期办结并做好回访的前提下，舆情与群体性风险整体可控。'});\n    }\n    risks.push({level:(isKey||isCross)?'中风险·协同复杂':'低风险·协同可控',cls:(isKey||isCross)?'mid':'low',title:'跨部门协同与职责边界',text:(isCross||isKey)\n      ? ('事项可能涉及行业监管、劳动保障、综治维稳等多条线，单部门闭环难度大。建议明确牵头单位与协办单位，建立会商纪要与时限清单，避免“来回踢皮球”导致诉求升级。')\n      : ('主责边界相对清晰，原则上可由「'+org+'」按常规流程签收办理；若办理中发现需其他部门配合，再升级为协同件。')});\n    risks.push({level:isKey?'中风险·反复发生':'低风险·个案特征',cls:isKey?'mid':'low',title:'同类事项复现与治理价值',text:isKey\n      ? ('结合近30天同类关键词聚类，该主题具备高频复现特征，不宜仅按“办结一单”处理。建议在个案处置同时沉淀规则完善、约谈平台或源头治理建议，防止同类诉求持续涌入。')\n      : ('目前更接近单点问题，办结后可通过回访确认满意度；若后续出现同类重复投诉，再纳入高频主题治理清单。')});\n  } else {\n    // 规范 cls 并补 title\n    risks = risks.map(function(r){\n      var cls = r.cls || 'mid';\n      if(cls==='risk-low') cls='low';\n      if(cls==='risk-mid') cls='mid';\n      if(cls==='risk-high'||cls==='danger') cls='high';\n      if(cls!=='low'&&cls!=='mid'&&cls!=='high'){\n        if((r.level||'').indexOf('高')>=0) cls='high';\n        else if((r.level||'').indexOf('中')>=0) cls='mid';\n        else if((r.level||'').indexOf('低')>=0) cls='low';\n        else cls='mid';\n      }\n      return {level:r.level,cls:cls,title:r.title||r.level,text:r.text};\n    });\n  }\n\n  // —— 研判结论：结构化多段 ——\n  var conclusion = ev.conclusion || '';\n  if(!conclusion || conclusion==='待AI分析' || conclusion.length < 50){\n    conclusion = '<b>一、事件定性<\/b><br>'\n      + '综合语义分类结果，建议将该事件按「' + cat + '」管理；关联群体类型为「' + group + '」'\n      + (tag ? '，核心诉求标签为「' + tag + '」' : '') + '。<br><br>'\n      + '<b>二、主要风险点<\/b><br>'\n      + (isUrgent ? '1）时效紧迫，需优先保障当事人安全与现场稳控；2）若信息公开不及时，易被二次传播放大；3）涉及平台/企业责任时，取证与约谈需同步推进。'\n        : isSensitive ? '1）舆情敏感，对外表述需统一；2）同类诉求可能被串联；3）行业规则争议若处理不当，可能影响区域新就业群体获得感。'\n        : isCross ? '1）多部门职责交叉；2）办理链条长、时限易超；3）需防止各部门分别答复口径冲突。'\n        : '1）属地常规民生诉求；2）重点在按期办结与回访；3）注意一次办成，减少重复投诉。')\n      + '<br><br><b>三、处置优先级建议<\/b><br>'\n      + (isUrgent ? '建议列为优先件，当日完成初核并明确下一环节责任人。' : isKey ? '建议纳入重点跟踪清单，明确7日内阶段性反馈节点。' : '建议按一般件时限办理，办结前完成当事人沟通确认。');\n  }\n\n  // —— 处置建议：可执行条目 ——\n  var suggestions = (ev.suggestions || []).slice();\n  var needExpandSug = suggestions.length < 2 || suggestions.every(function(s){ return typeof s==='string' && s.length < 20; });\n  if(needExpandSug){\n    suggestions = [\n      {title:'首接核实与信息补全',who:org,text:'24小时内完成诉求要素核验（当事人、时间、地点、诉求要点、是否涉及平台/企业），补充佐证材料，形成《初核情况表》并反馈热线/网格来源端。'},\n      {title:(isCross||isKey)?'联合会商与责任分解':'主责办理与进度公示',who:(isCross||isKey)?'牵头部门+协办单位':org,text:(isCross||isKey)\n        ? '3个工作日内组织联合研判，明确牵头、协办、时限与办结标准；会商纪要抄送综治/信访备案，避免多头答复。'\n        : '按权责清单明确办理处室与经办人，在系统节点及时更新办理进度，关键节点主动联系当事人说明进展。'},\n      {title:'源头治理与规则完善',who:'行业主管部门',text:'若确属平台规则、劳动用工、通行准入等源头问题，在个案办结同时提出约谈企业、完善公示、优化通行/用工规则等建议，形成可复用处置口径。'},\n      {title:'回访闭环与案例沉淀',who:'承办单位',text:'办结后48小时内完成满意度回访；将问题类型、处置路径、适用条款写入案例库，供同类事件智能推荐。'}\n    ];\n  } else {\n    suggestions = suggestions.map(function(s,i){\n      if(typeof s === 'string') return {title:'建议'+(i+1),who:org,text:s};\n      return s;\n    });\n  }\n\n  // —— 法律/政策依据 ——\n  var legalRefs = (ev.legalRefs || []).slice();\n  if(legalRefs.length < 2){\n    legalRefs = [\n      {law:'《关于维护新就业形态劳动者劳动保障权益的指导意见》',content:'平台企业应当依法合规用工，积极履行用工责任；对不完全符合确立劳动关系情形但企业对劳动者进行劳动管理的，指导企业与劳动者订立书面协议，合理确定企业与劳动者的权利义务。',apply:'适用于网约车、即时配送、货运等平台用工场景下的劳动关系认定、报酬与休息等争议处置。'},\n      {law:'《中华人民共和国劳动法》相关条款',content:'用人单位和劳动者必须依法参加社会保险，缴纳社会保险费；劳动者享有平等就业和选择职业、取得劳动报酬、休息休假、获得劳动安全卫生保护等权利。',apply:'在涉及社保断缴、报酬克扣、超时劳动等投诉中，可作为约谈平台/用人单位及协调人社部门的基本依据。'},\n      {law:'《信访工作条例》及基层治理闭环要求',content:'对依法应当通过诉讼、仲裁等途径解决的事项，引导当事人按法定程序办理；对属于本地区本部门职权范围的，应当受理并及时办理，不得推诿、敷衍、拖延。',apply:'用于规范热线转办件签收时限、办理反馈与闭环销号，防止“体外循环”。'}\n    ];\n    if(tag && (tag.indexOf('配送')>=0 || tag.indexOf('禁停')>=0 || tag.indexOf('道路')>=0)){\n      legalRefs.unshift({law:'《城市道路管理条例》相关规定',content:'经批准挖掘城市道路的，应当在施工现场设置明显标志和安全防围设施；占用、挖掘城市道路的，应当按规定恢复原状。',apply:'适用于施工占道、通行受阻、配送通道受影响等城市管理类诉求。'});\n    }\n  } else {\n    legalRefs = legalRefs.map(function(l){\n      return {law:l.law, content:l.content, apply:l.apply || '请结合本案事实与部门权责，在约谈、答复与执法文书中引用对应条款。'};\n    });\n  }\n\n\n  return {\n    riskItems:risks,\n    conclusion:conclusion,\n    suggestions:suggestions,\n    legalRefs:legalRefs,\n    meta:{group:group,cat:cat,tag:tag,desc:desc,isKey:isKey}\n  };\n}\n\nfunction renderRightAI(ev){\n  if(!ev) return;\n  var ai = enrichAIContent(ev);\n  var h = '<div style=\"padding:16px\">';\n  h += '<div style=\"display:flex;gap:0;border-bottom:1px solid #E5E6EB;margin-bottom:16px;padding:0 4px;overflow-x:auto\">';\n  var tabs = ['风险研判','研判结论','处置建议','风险评估依据'];\n  tabs.forEach(function(name,i){\n    h += '<div class=\"ai-sub-tab'+(i===0?' on':'')+'\" data-ait=\"'+i+'\" onclick=\"switchRightAITab('+i+')\" style=\"padding:8px 16px;font-size:13px;cursor:pointer;color:'+(i===0?'#165DFF':'#666')+';font-weight:'+(i===0?'500':'400')+';border-bottom:2px solid '+(i===0?'#165DFF':'transparent')+';white-space:nowrap\">'+name+'<\/div>';\n  });\n  h += '<\/div>';\n\n  // 0 风险研判\n  h += '<div id=\"rightAIPane0\">';\n  h += '<div style=\"font-size:12px;color:#86909C;margin-bottom:12px;line-height:1.6\">从舆情、群体性、协同复杂度等维度评估风险等级，并给出关注点与应对提示。<\/div>';\n  ai.riskItems.forEach(function(r){\n    var bg = r.cls==='low' ? 'background:#E8FFEA;border-left:3px solid #00B42A' : (r.cls==='mid' ? 'background:#FFF7E8;border-left:3px solid #FF7D00' : 'background:#FFECE8;border-left:3px solid #F53F3F');\n    var tc = r.cls==='low' ? '#00B42A' : (r.cls==='mid' ? '#FF7D00' : '#F53F3F');\n    h += '<div style=\"padding:12px 14px;border-radius:8px;margin-bottom:10px;font-size:13px;line-height:1.7;'+bg+'\">';\n    h += '<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\"><span style=\"font-weight:600;color:'+tc+'\">'+(r.level||'')+'<\/span>';\n    if(r.title && r.title!==r.level) h += '<span style=\"font-size:12px;color:#4E5969\">· '+(r.title||'')+'<\/span>';\n    h += '<\/div><div style=\"color:#1D2129\">'+(r.text||'')+'<\/div><\/div>';\n  });\n  h += '<\/div>';\n\n  // 1 研判结论\n  h += '<div id=\"rightAIPane1\" style=\"display:none\">';\n  h += '<div style=\"padding:16px;background:#FAFBFC;border:1px solid #E5E6EB;border-radius:8px;font-size:13px;line-height:1.85;color:#1D2129\">';\n  h += '<div style=\"margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed #E5E6EB;font-size:12px;color:#86909C\">事件摘要：'+(ai.meta.desc||'—')+'　｜　群体：'+(ai.meta.group||'—')+(ai.meta.tag?'　｜　标签：'+ai.meta.tag:'')+'<\/div>';\n  h += ai.conclusion;\n  h += '<\/div><\/div>';\n\n  // 2 处置建议\n  h += '<div id=\"rightAIPane2\" style=\"display:none\">';\n  h += '<div style=\"font-size:12px;color:#86909C;margin-bottom:12px\">以下建议按办理顺序排列，可一键作为拟办意见参考，最终以人工审核为准。<\/div>';\n  ai.suggestions.forEach(function(s,i){\n    var title = s.title || ('建议'+(i+1));\n    var text = s.text || s;\n    var who = s.who || '';\n    h += '<div style=\"border:1px solid #E5E6EB;border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fff\">';\n    h += '<div style=\"display:flex;align-items:flex-start;gap:10px\">';\n    h += '<span style=\"width:22px;height:22px;border-radius:50%;background:#FFF7E8;color:#FF7D00;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0\">'+(i+1)+'<\/span>';\n    h += '<div style=\"flex:1;min-width:0\">';\n    h += '<div style=\"font-size:13px;font-weight:600;color:#1D2129;margin-bottom:4px\">'+title+'<\/div>';\n    if(who) h += '<div style=\"font-size:12px;color:#165DFF;margin-bottom:6px\">建议责任主体：'+who+'<\/div>';\n    h += '<div style=\"font-size:13px;line-height:1.75;color:#4E5969\">'+text+'<\/div>';\n    h += '<\/div><\/div><\/div>';\n  });\n  h += '<\/div>';\n\n  // 3 风险评估依据\n  h += '<div id=\"rightAIPane3\" style=\"display:none\">';\n  h += '<div style=\"font-size:13px;font-weight:600;color:#1D2129;margin-bottom:10px\">政策法规与适用说明<\/div>';\n  ai.legalRefs.forEach(function(l){\n    h += '<div style=\"border:1px solid #E5E6EB;border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#FAFBFC\">';\n    h += '<div style=\"font-size:13px;font-weight:600;color:#1D2129;margin-bottom:6px\">'+l.law+'<\/div>';\n    h += '<div style=\"font-size:12px;line-height:1.75;color:#4E5969;margin-bottom:8px\">'+l.content+'<\/div>';\n    if(l.apply) h += '<div style=\"font-size:12px;line-height:1.7;color:#165DFF;background:#E8F3FF;padding:8px 10px;border-radius:6px\"><b>本案适用：<\/b>'+l.apply+'<\/div>';\n    h += '<\/div>';\n  });\n  h += '<div style=\"font-size:11px;color:#C9CDD4;margin-top:8px\">说明：AI分析结论仅供辅助研判，不作为最终行政决定依据；引用法规请以正式文本及最新修订为准。<\/div>';\n  h += '<\/div><\/div>';\n  document.getElementById('rightPane2').innerHTML = h;\n}\n\nfunction switchRightAITab(idx){\n  var tabs = document.querySelectorAll('#rightPane2 .ai-sub-tab');\n  tabs.forEach(function(t,i){\n    t.style.color = i===idx ? '#165DFF' : '#666';\n    t.style.borderBottom = i===idx ? '2px solid #165DFF' : '2px solid transparent';\n    t.style.fontWeight = i===idx ? '500' : '400';\n    t.classList.toggle('on',i===idx);\n  });\n  for(var i=0;i<4;i++){var p=document.getElementById('rightAIPane'+i);if(p) p.style.display=i===idx?'block':'none'}\n}\n\n// ===== Toast =====\nfunction showToast(msg, type){\n  const c = document.getElementById('toastContainer');\n  const t = document.createElement('div');\n  t.className = 'toast toast-' + (type||'info');\n  t.textContent = msg;\n  c.appendChild(t);\n  setTimeout(function(){t.style.animation='toastOut .3s ease forwards';setTimeout(function(){t.remove()},300)},1700);\n}\n\n// ===== Modal =====\nfunction showModal(title, bodyHtml, footerHtml){\n  closeAllModals();\n  const mask = document.createElement('div');\n  mask.className = 'modal-mask';\n  mask.onclick = function(e){if(e.target===mask)closeAllModals()};\n  let h = '<div class=\"modal-box\"><div class=\"modal-header\"><span>'+title+'<\/span><span class=\"close\" onclick=\"closeAllModals()\">✕<\/span><\/div>';\n  h += '<div class=\"modal-body\">'+bodyHtml+'<\/div>';\n  if(footerHtml) h += '<div class=\"modal-footer\">'+footerHtml+'<\/div>';\n  h += '<\/div>';\n  mask.innerHTML = h;\n  document.body.appendChild(mask);\n}\nfunction closeAllModals(){document.querySelectorAll('.modal-mask').forEach(function(m){m.remove()})}\n\n// ===== AI Classify Modal =====\nfunction showAIClassify(){\n  if(!currentEvent) return;\n  const ac = currentEvent.aiClassify;\n  let h = '<div style=\"margin-bottom:14px\"><div style=\"font-size:12px;color:var(--tx2);margin-bottom:4px\">AI分类结果<\/div><div style=\"font-size:14px;font-weight:500\">'+ac.result+'<\/div><\/div>';\n  h += '<div style=\"margin-bottom:14px\"><div style=\"font-size:12px;color:var(--tx2);margin-bottom:4px\">综合置信度：'+ac.confidence+'%<\/div><div class=\"progress-bar\"><div class=\"fill\" style=\"width:'+ac.confidence+'%;background:var(--accent)\"><\/div><\/div><\/div>';\n  if(ac.keywords.length>0){\n    h += '<div style=\"margin-bottom:14px\"><div style=\"font-size:12px;color:var(--tx2);margin-bottom:6px\">关键词匹配<\/div>';\n    ac.keywords.forEach(function(k){\n      h += '<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px\"><span style=\"width:70px;font-size:12px\">'+k.k+'<\/span><div class=\"progress-bar\" style=\"flex:1\"><div class=\"fill\" style=\"width:'+k.v+'%;background:'+(k.v>=80?'var(--success)':k.v>=60?'var(--warning)':'var(--tx3)')+'\"><\/div><\/div><span style=\"font-size:11px;color:var(--tx2);width:32px;text-align:right\">'+k.v+'%<\/span><\/div>';\n    });\n    h += '<\/div>';\n  }\n  h += '<div><div style=\"font-size:12px;color:var(--tx2);margin-bottom:4px\">分类依据<\/div><div style=\"font-size:12px;line-height:1.7;color:var(--tx);background:var(--bg2);padding:8px 12px;border-radius:var(--radius)\">'+ac.basis+'<\/div><\/div>';\n  showModal('AI分类建议详情', h);\n}\n\n// ===== Score Detail Modal =====\nfunction showScoreDetail(){\n  if(!currentEvent)return;\n  const sd = currentEvent.scoreDetail;\n  let h = '';\n  sd.factors.forEach(function(f){\n    const pct = (f.val/f.max*100).toFixed(0);\n    const color = pct>=80?'var(--danger)':pct>=50?'var(--warning)':'var(--success)';\n    h += '<div class=\"score-factor\"><span class=\"name\">'+f.name+'<\/span><div class=\"bar\"><div class=\"progress-bar\"><div class=\"fill\" style=\"width:'+pct+'%;background:'+color+'\"><\/div><\/div><\/div><span class=\"val\" style=\"color:'+color+'\">'+f.val+'/'+f.max+'<\/span><\/div>';\n  });\n  h += '<div style=\"border-top:1px solid var(--bd);padding-top:10px;margin-top:6px;display:flex;align-items:center;justify-content:space-between\"><span style=\"font-weight:500;font-size:13px\">综合评分<\/span><span style=\"font-size:18px;font-weight:600;color:'+currentEvent.scoreColor+'\">'+currentEvent.score+'/100<\/span><\/div>';\n  showModal('风险评分详情', h);\n}\n\n// ===== Cases Modal =====\nfunction showCases(){\n  let h = '';\n  CASES.forEach(function(c,i){\n    const statusCls = c.status==='已办结'?'tag-success':'tag-warning';\n    h += '<div class=\"case-card\"><div class=\"case-title\">案例'+(i+1)+'：'+c.title+'<\/div><div class=\"case-meta\">'+c.time+' <span class=\"tag '+statusCls+'\" style=\"margin-left:4px\">'+c.status+'<\/span><\/div><div class=\"case-plan\">'+c.plan+'<\/div><\/div>';\n  });\n  showModal('先行案例详情（3起）', h);\n}\n\n// ===== Adopt/Reject =====\nfunction adoptSugg(idx, btn){\n  const item = document.getElementById('sug_'+idx);\n  const actions = item.querySelector('.sug-actions');\n  const adoptBtn = actions.querySelector('.btn-adopt');\n  const rejectBtn = actions.querySelector('.btn-reject');\n  if(adoptBtn.classList.contains('adopted')||rejectBtn.classList.contains('rejected')) return;\n  adoptBtn.classList.add('adopted');adoptBtn.textContent='已采纳';rejectBtn.style.display='none';\n  showToast('已采纳建议，将同步至处置方案','success');\n}\nfunction rejectSugg(idx, btn){\n  let h = '<div class=\"form-group\"><label>请说明不采纳原因<\/label><textarea id=\"rejectReason\" placeholder=\"请输入不采纳原因...\" style=\"width:100%;min-height:80px;padding:8px 12px;border:1px solid var(--bd);border-radius:var(--radius);font-size:13px;resize:vertical\"><\/textarea><\/div>';\n  showModal('不采纳反馈', h, '<button class=\"btn\" onclick=\"closeAllModals()\">取消<\/button><button class=\"btn btn-primary\" onclick=\"submitReject('+idx+')\">提交反馈<\/button>');\n}\nfunction submitReject(idx){\n  const item = document.getElementById('sug_'+idx);\n  const actions = item.querySelector('.sug-actions');\n  actions.querySelector('.btn-adopt').style.display='none';\n  const rejectBtn = actions.querySelector('.btn-reject');\n  rejectBtn.classList.add('rejected');rejectBtn.textContent='已反馈';\n  closeAllModals();showToast('反馈已记录，AI将持续优化','info');\n}\n\n// ===== Collab Form =====\nfunction showCollabForm(){\n  let h = '<div class=\"form-group\"><label>协同部门<\/label><select><option>请选择协同部门<\/option><option>市场监管局<\/option><option>人社局<\/option><option>交通局<\/option><option>信访局<\/option><option>综合行政执法局<\/option><option>建设局<\/option><\/select><\/div>';\n  h += '<div class=\"form-group\"><label>协同事项<\/label><input type=\"text\" placeholder=\"请输入协同事项说明\"><\/div>';\n  h += '<div class=\"form-group\"><label>办理期限<\/label><input type=\"date\" value=\"2026-07-10\"><\/div>';\n  h += '<div class=\"form-group\"><label>协同要求<\/label><textarea placeholder=\"请输入对协同部门的具体要求...\"><\/textarea><\/div>';\n  showModal('发起协同', h, '<button class=\"btn\" onclick=\"closeAllModals()\">取消<\/button><button class=\"btn btn-primary\" onclick=\"submitCollab()\">确认发起<\/button>');\n}\nfunction submitCollab(){closeAllModals();showToast('协同发起成功，已通知相关部门','success')}\n\n// 主标签页切换\nfunction switchToTab(idx) {\n  // 更新标签样式\n  document.querySelectorAll('#mainTabs .tag-tab').forEach(function(t) {\n    t.classList.remove('on');\n  });\n  var activeTab = document.querySelector('#mainTabs .tag-tab[data-tab=\"'+idx+'\"]');\n  if (activeTab) activeTab.classList.add('on');\n\n  // 显示对应内容\n  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('visible'); });\n  document.getElementById('tabContent' + idx).classList.add('visible');\n  \n  // 渲染对应tab的表格\n  currentTab = idx;\n  renderTableForTab(idx);\n}\n\n// 列设置相关\nvar allColumns = [\n  {key:'source',name:'事件来源',default:true,width:'120px'},\n  {key:'name',name:'事件名称',default:true,width:'180px'},\n  {key:'id',name:'事件编号',default:true,width:'170px'},\n  {key:'provinceCode',name:'省事件编码',default:true,width:'180px'},\n  {key:'level1',name:'一级分类',default:true,width:'110px'},\n  {key:'level2',name:'二级分类',default:true,width:'100px'},\n  {key:'level3',name:'三级分类',default:true,width:'100px'},\n  {key:'desc',name:'事件描述',default:true,width:'200px'},\n  {key:'eventLevel',name:'事件等级',default:false,width:'80px'},\n  {key:'org',name:'所属组织',default:false,width:'120px'},\n  {key:'reportOrg',name:'上报组织',default:false,width:'120px'},\n  {key:'district',name:'上报区县',default:false,width:'80px'},\n  {key:'reporter',name:'上报人',default:false,width:'70px'},\n  {key:'handleLevel',name:'当前处置层级',default:false,width:'100px'},\n  {key:'status',name:'状态',default:false,width:'80px'},\n  {key:'eventId',name:'事件标识',default:false,width:'120px'},\n  {key:'handleTime',name:'处置总用时',default:false,width:'90px'},\n  {key:'occurTime',name:'事发时间',default:false,width:'100px'},\n  {key:'closeTime',name:'办结时间',default:false,width:'100px'},\n  {key:'op',name:'操作',default:true,width:'60px'}\n];\nvar visibleColumns = allColumns.filter(function(c){ return c.default; }).map(function(c){ return c.key; });\nvar currentTab = 0;\nvar filteredEvents = allEvents.slice();\nvar currentPage = 1;\nvar PAGE_SIZE = 8;\n\nfunction isColumnVisible(key) {\n  return visibleColumns.indexOf(key) >= 0;\n}\n\nfunction toggleColumnPanel(tabIdx) {\n  var panel = document.getElementById('columnPanel' + tabIdx);\n  if (panel.style.display === 'none') {\n    renderColumnCheckboxes(tabIdx);\n    panel.style.display = 'block';\n  } else {\n    panel.style.display = 'none';\n  }\n}\n\nfunction renderColumnCheckboxes(tabIdx) {\n  var container = document.getElementById('columnCheckboxes' + tabIdx);\n  var html = '';\n  allColumns.forEach(function(col) {\n    var checked = isColumnVisible(col.key) ? 'checked' : '';\n    html += '<label style=\"display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px\">';\n    html += '<input type=\"checkbox\" class=\"col-cb\" data-col=\"'+col.key+'\" '+checked+' style=\"width:14px;height:14px;accent-color:var(--primary)\">';\n    html += '<span>'+col.name+'<\/span>';\n    html += '<\/label>';\n  });\n  container.innerHTML = html;\n  document.getElementById('selectAllCols' + tabIdx).checked = visibleColumns.length === allColumns.length;\n}\n\nfunction toggleAllColumns(tabIdx) {\n  var checked = document.getElementById('selectAllCols' + tabIdx).checked;\n  document.querySelectorAll('.col-cb').forEach(function(cb){ cb.checked = checked; });\n}\n\nfunction saveColumns(tabIdx) {\n  visibleColumns = [];\n  document.querySelectorAll('.col-cb').forEach(function(cb) {\n    if (cb.checked) visibleColumns.push(cb.getAttribute('data-col'));\n  });\n  updateTableHeader(tabIdx);\n  document.getElementById('columnPanel' + tabIdx).style.display = 'none';\n  renderTableForTab(tabIdx);\n  showToast('表头设置已保存', 'success');\n}\n\nfunction updateTableHeader(tabIdx) {\n  var thead = document.getElementById('tableHead' + tabIdx);\n  var tr = thead.querySelector('tr');\n  var html = '';\n  allColumns.forEach(function(col) {\n    if (isColumnVisible(col.key)) {\n      var w = col.width ? 'width:'+col.width : '';\n      html += '<th data-col=\"'+col.key+'\" style=\"'+w+'\">'+col.name+'<\/th>';\n    }\n  });\n  tr.innerHTML = html;\n}\n\nfunction downloadCsv(filename, rows){\n  function cell(v){\n    var s=v==null?'':String(v);\n    if(/[\",\\n\\r]/.test(s)) s='\"'+s.replace(/\"/g,'\"\"')+'\"';\n    return s;\n  }\n  var text='\\uFEFF'+rows.map(function(r){return r.map(cell).join(',');}).join('\\r\\n');\n  var blob=new Blob([text],{type:'text/csv;charset=utf-8'});\n  var a=document.createElement('a');\n  a.href=URL.createObjectURL(blob);\n  a.download=filename;\n  document.body.appendChild(a);\n  a.click();\n  setTimeout(function(){\n    URL.revokeObjectURL(a.href);\n    if(a.parentNode) a.parentNode.removeChild(a);\n  },1000);\n  showToast('已导出','success');\n}\nfunction eventExportValue(ev, key){\n  if(key==='name'||key==='desc') return ev.desc||'';\n  if(key==='district') return ev.location||'';\n  if(key==='occurTime') return ev.time||'';\n  if(key==='eventId') return ev.category||'';\n  var v=ev[key];\n  return v==null?'':v;\n}\nfunction exportTable(){\n  var cols=allColumns.filter(function(c){return c.key!=='op' && isColumnVisible(c.key);});\n  var rows=[['群体类型'].concat(cols.map(function(c){return c.name;}))];\n  filteredEvents.forEach(function(ev){\n    rows.push([ev.group||''].concat(cols.map(function(c){return eventExportValue(ev, c.key);})));\n  });\n  downloadCsv('全量新就业群体事件.csv', rows);\n}\n\nfunction openDetail(id) {\n  var ev = allEvents.find(function(e){ return e.id === id; });\n  if (!ev) return;\n  openDrawer(id);\n}\n\nfunction openCorrect(id) {\n  var ev = allEvents.find(function(e){ return e.id === id; });\n  if (!ev) return;\n  currentDrawerEvent = ev;\n  openCorrectModal();\n}\n\nfunction renderTableForTab(tabIdx) {\n  var tbody = document.getElementById('tableBody' + tabIdx);\n  var start = (currentPage - 1) * PAGE_SIZE;\n  var pageData = filteredEvents.slice(start, start + PAGE_SIZE);\n  var html = '';\n  pageData.forEach(function(ev) {\n    html += '<tr onclick=\"openDetail(\\''+ev.id+'\\')\">';\n    if (isColumnVisible('source')) html += '<td>'+ev.source+'<\/td>';\n    if (isColumnVisible('name')) html += '<td style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+ev.desc+'<\/td>';\n    if (isColumnVisible('id')) html += '<td>'+ev.id+'<\/td>';\n    if (isColumnVisible('provinceCode')) html += '<td>'+ev.provinceCode+'<\/td>';\n    if (isColumnVisible('level1')) html += '<td>'+ev.level1+'<\/td>';\n    if (isColumnVisible('level2')) html += '<td>'+ev.level2+'<\/td>';\n    if (isColumnVisible('level3')) html += '<td>'+ev.level3+'<\/td>';\n    if (isColumnVisible('desc')) html += '<td style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+ev.desc+'<\/td>';\n    if (isColumnVisible('op')) html += '<td data-col=\"op\"><span class=\"btn-link\" onclick=\"event.stopPropagation();openDrawer(\\''+ev.id+'\\')\">查看<\/span><\/td>';\n    html += '<\/tr>';\n  });\n  tbody.innerHTML = html;\n  renderPagination(tabIdx);\n}\n\nfunction renderPagination(tabIdx) {\n  var total = filteredEvents.length;\n  var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));\n  if (currentPage > totalPages) currentPage = totalPages;\n  var pg = document.getElementById('pagination' + tabIdx);\n  pg.innerHTML = '<span class=\"page-info\">共 '+total+' 条<\/span>' +\n    '<span class=\"page-info\">当前第 '+currentPage+' / '+totalPages+' 页<\/span>' +\n    '<button class=\"page-btn'+(currentPage<=1?' disabled':'')+'\" onclick=\"goPage('+(currentPage-1)+')\">&lsaquo; 上一页<\/button>' +\n    '<button class=\"page-btn'+(currentPage>=totalPages?' disabled':'')+'\" onclick=\"goPage('+(currentPage+1)+')\">下一页 &rsaquo;<\/button>';\n}\n\nfunction goPage(p) {\n  var totalPages = Math.max(1, Math.ceil(filteredEvents.length / PAGE_SIZE));\n  if (p < 1 || p > totalPages) return;\n  currentPage = p;\n  renderTableForTab(currentTab);\n}\n\nfunction applyAllFilters(tabIdx) {\n  var nameVal = (document.getElementById('filterName0') || {}).value || '';\n  var eventIdVal = (document.getElementById('filterEventId0') || {}).value || '';\n  var reportDateVal = (document.getElementById('filterReportDate0') || {}).value || '';\n  var occurDateVal = (document.getElementById('filterOccurDate0') || {}).value || '';\n  var locationVal = (document.getElementById('filterLocation0') || {}).value || '';\n  var reporterVal = (document.getElementById('filterReporter0') || {}).value || '';\n  var reportOrgVal = (document.getElementById('filterReportOrg0') || {}).value || '';\n  var descVal = (document.getElementById('filterDesc0') || {}).value || '';\n  var sourceEl = document.getElementById('filterSource' + tabIdx);\n  var source = sourceEl ? sourceEl.value : '';\n  var tagEl = document.getElementById('filterTag' + tabIdx);\n  var tag = tagEl ? tagEl.value : '';\n  var categoryEl = document.getElementById('filterCategory0');\n  var category = categoryEl ? categoryEl.value : '';\n  var aiTagEl = document.getElementById('filterAiTag0');\n  var aiTag = aiTagEl ? aiTagEl.value : '';\n\n  // Parse date ranges\n  var reportDateFrom = '', reportDateTo = '';\n  if (reportDateVal && reportDateVal.indexOf('~') > -1) {\n    var parts = reportDateVal.split('~').map(function(s){ return s.trim(); });\n    reportDateFrom = parts[0] || '';\n    reportDateTo = parts[1] || '';\n  }\n  var occurDateFrom = '', occurDateTo = '';\n  if (occurDateVal && occurDateVal.indexOf('-') > -1) {\n    var oparts = occurDateVal.split('-').map(function(s){ return s.trim(); });\n    occurDateFrom = oparts[0] || '';\n    occurDateTo = oparts[1] || '';\n  }\n\n  // Collect checked checkboxes\n  var checkedProgress = [], checkedLevel = [], checkedOvertime = [], checkedQualitative = [];\n  document.querySelectorAll('#moreFilters0 .checkbox-group input[type=\"checkbox\"]:checked').forEach(function(cb) {\n    var grp = cb.getAttribute('data-group');\n    if (grp === 'progress') checkedProgress.push(cb.value);\n    else if (grp === 'level') checkedLevel.push(cb.value);\n    else if (grp === 'overtime') checkedOvertime.push(cb.value);\n    else if (grp === 'qualitative') checkedQualitative.push(cb.value);\n  });\n\n  filteredEvents = allEvents.filter(function(ev) {\n    // Basic filters\n    if (nameVal && ev.desc.indexOf(nameVal) !== 0) return false;\n    if (eventIdVal && ev.id.indexOf(eventIdVal) < 0) return false;\n    if (reportDateFrom && ev.time < reportDateFrom) return false;\n    if (reportDateTo && ev.time > reportDateTo + ' 23:59:59') return false;\n    if (occurDateFrom && ev.time < occurDateFrom) return false;\n    if (occurDateTo && ev.time > occurDateTo + ' 23:59:59') return false;\n    if (locationVal && ev.location.indexOf(locationVal) < 0) return false;\n    if (reporterVal && ev.reporter.indexOf(reporterVal) < 0) return false;\n    if (reportOrgVal && ev.org !== reportOrgVal) return false;\n    if (descVal && ev.desc.indexOf(descVal) < 0) return false;\n    // More filters\n    if (source && ev.source !== source) return false;\n    if (tag) {\n      if (tag === '紧急' && !(ev.category && ev.category.indexOf('紧急') >= 0)) return false;\n      if (tag === '敏感' && !(ev.category && ev.category.indexOf('敏感') >= 0)) return false;\n      if (tag === '多跨协同' && !(ev.category && ev.category.indexOf('多跨协同') >= 0)) return false;\n    }\n    if (category && ev.category !== category) return false;\n    if (aiTag && ev.aiTag !== aiTag) return false;\n    if (checkedLevel.length > 0 && checkedLevel.indexOf(ev.eventLevel) < 0) return false;\n    return true;\n  });\n  currentPage = 1;\n  renderTableForTab(tabIdx);\n}\n\nfunction doFilter(tabIdx) {\n  applyAllFilters(tabIdx);\n  var hint = document.getElementById('filterHint' + tabIdx);\n  hint.textContent = '已筛选出 ' + filteredEvents.length + ' 条记录';\n  hint.classList.add('show');\n  updateSelectedTags();\n  showToast('查询完成，共 ' + filteredEvents.length + ' 条记录', 'info');\n}\n\nfunction resetFilter(tabIdx) {\n  var nameEl = document.getElementById('filterName0');\n  if (nameEl) nameEl.value = '';\n  var eventIdEl = document.getElementById('filterEventId0');\n  if (eventIdEl) eventIdEl.value = '';\n  var reportDateEl = document.getElementById('filterReportDate0');\n  if (reportDateEl) reportDateEl.value = '2026-07-01 ~ 2026-07-24';\n  var occurDateEl = document.getElementById('filterOccurDate0');\n  if (occurDateEl) occurDateEl.value = '';\n  var locationEl = document.getElementById('filterLocation0');\n  if (locationEl) locationEl.value = '';\n  var reporterEl = document.getElementById('filterReporter0');\n  if (reporterEl) reporterEl.value = '';\n  var reportOrgEl = document.getElementById('filterReportOrg0');\n  if (reportOrgEl) reportOrgEl.value = '';\n  var descEl = document.getElementById('filterDesc0');\n  if (descEl) descEl.value = '';\n  var sourceEl = document.getElementById('filterSource' + tabIdx);\n  if (sourceEl) sourceEl.value = '';\n  var tagEl = document.getElementById('filterTag' + tabIdx);\n  if (tagEl) tagEl.value = '';\n  var categoryEl = document.getElementById('filterCategory0');\n  if (categoryEl) categoryEl.value = '';\n  var aiTagEl = document.getElementById('filterAiTag0');\n  if (aiTagEl) aiTagEl.value = '';\n  // Uncheck all checkboxes\n  document.querySelectorAll('#moreFilters0 input[type=\"checkbox\"]').forEach(function(cb){ cb.checked = false; });\n  document.getElementById('filterHint' + tabIdx).classList.remove('show');\n  updateSelectedTags();\n  filteredEvents = allEvents.slice();\n  currentPage = 1;\n  renderTableForTab(tabIdx);\n  showToast('筛选条件已重置', 'info');\n}\n\nfunction toggleMoreFilters(tabIdx) {\n  var panel = document.getElementById('moreFilters' + tabIdx);\n  var btn = document.getElementById('expandBtn' + tabIdx);\n  if (panel.classList.contains('show')) {\n    panel.classList.remove('show');\n    btn.textContent = '展开';\n  } else {\n    panel.classList.add('show');\n    btn.textContent = '收起';\n  }\n}\n\nfunction onFilterCheckboxChange(tabIdx) {\n  updateSelectedTags();\n}\n\nfunction updateSelectedTags() {\n  var container = document.getElementById('selectedTags0');\n  if (!container) return;\n  var html = '';\n  var groupLabels = {progress:'进度状态',level:'事件等级',overtime:'超期状态',qualitative:'定性分类'};\n  document.querySelectorAll('#moreFilters0 .checkbox-group input[type=\"checkbox\"]:checked').forEach(function(cb) {\n    var grp = cb.getAttribute('data-group');\n    var label = (groupLabels[grp] || grp) + ': ' + cb.value;\n    html += '<span class=\"selected-tag\" onclick=\"this.remove();updateSelectedTags()\">' + label + ' ×<\/span>';\n  });\n  container.innerHTML = html;\n}\n\n// 收藏星标切换\nfunction toggleSub(menuItem){\n  var subMenu = menuItem.nextElementSibling;\n  if(!subMenu || !subMenu.classList.contains('sub-menu')) return;\n  var isOpen = subMenu.style.maxHeight && subMenu.style.maxHeight !== '0px';\n  if(isOpen){\n    subMenu.style.maxHeight = '0px';\n    subMenu.style.opacity = '0';\n    menuItem.classList.remove('expanded');\n  } else {\n    subMenu.style.maxHeight = subMenu.scrollHeight + 'px';\n    subMenu.style.opacity = '1';\n    menuItem.classList.add('expanded');\n  }\n}\n\nfunction toggleStar(el) {\n  el.classList.toggle('active');\n  el.textContent = el.classList.contains('active') ? '★' : '☆';\n}\n\n// 修正分类弹窗\nfunction openCorrectModal(){\n  var ev = currentDrawerEvent;\n  if(!ev) return;\n  document.getElementById('correctGroup').value = ev.group || '';\n  document.getElementById('correctLevel').value = groupEventClass(ev);\n  document.getElementById('correctReason').value = '';\n  document.getElementById('correctMask').classList.add('show');\n  document.getElementById('correctModal').style.display = 'block';\n}\nfunction closeCorrectModal(){\n  document.getElementById('correctMask').classList.remove('show');\n  document.getElementById('correctModal').style.display = 'none';\n}\nfunction submitCorrect(){\n  var group = document.getElementById('correctGroup').value;\n  var level = document.getElementById('correctLevel').value;\n  var reason = document.getElementById('correctReason').value.trim();\n  if(!group){showToast('请选择事件群体类型','warning');return;}\n  if(!level){showToast('请选择新就业群体事件分类','warning');return;}\n  if(!reason){showToast('请填写修正理由','warning');return;}\n  currentDrawerEvent.group = group;\n  applyGroupEventClass(currentDrawerEvent, level);\n  if(typeof allEvents!=='undefined'){\n    for(var i=0;i<allEvents.length;i++){\n      if(allEvents[i].id === currentDrawerEvent.id){\n        allEvents[i].group = group;\n        applyGroupEventClass(allEvents[i], level);\n        break;\n      }\n    }\n  }\n  closeCorrectModal();\n  showToast('修正成功，群体类型：'+group+'，事件分类：'+level,'success');\n  renderLeftBasic(currentDrawerEvent);\n  renderTableForTab(0);\n}\n\n// 初始化渲染\nrenderTableForTab(0);\n<\/script>\n\n<!-- Toast Container -->\n<div class=\"toast-container\" id=\"toastContainer\"><\/div>\n\n<\/body>\n<\/html>\n","p55":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>\"e拨就灵\" - \n    var title = s.title || ('建议'+(i+1));\n    var text = s.text || s;\n    var who = s.who || '';\n    h += '<div style=\"border:1px solid #E5E6EB;border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fff\">';\n    h += '<div style=\"display:flex;align-items:flex-start;gap:10px\">';\n    h += '<span style=\"width:22px;height:22px;border-radius:50%;background:#FFF7E8;color:#FF7D00;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0\">'+(i+1)+'<\/span>';\n    h += '<div style=\"flex:1;min-width:0\">';\n    h += '<div style=\"font-size:13px;font-weight:600;color:#1D2129;margin-bottom:4px\">'+title+'<\/div>';\n    if(who) h += '<div style=\"font-size:12px;color:#165DFF;margin-bottom:6px\">建议责任主体：'+who+'<\/div>';\n    h += '<div style=\"font-size:13px;line-height:1.75;color:#4E5969\">'+text+'<\/div>';\n    h += '<\/div><\/div><\/div>';\n  });\n  h += '<\/div>';\n\n  // 3 风险评估依据\n  h += '<div id=\"rightAIPane3\" style=\"display:none\">';\n  h += '<div style=\"font-size:13px;font-weight:600;color:#1D2129;margin-bottom:10px\">政策法规与适用说明<\/div>';\n  ai.legalRefs.forEach(function(l){\n    h += '<div style=\"border:1px solid #E5E6EB;border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#FAFBFC\">';\n    h += '<div style=\"font-size:13px;font-weight:600;color:#1D2129;margin-bottom:6px\">'+l.law+'<\/div>';\n    h += '<div style=\"font-size:12px;line-height:1.75;color:#4E5969;margin-bottom:8px\">'+l.content+'<\/div>';\n    if(l.apply) h += '<div style=\"font-size:12px;line-height:1.7;color:#165DFF;background:#E8F3FF;padding:8px 10px;border-radius:6px\"><b>本案适用：<\/b>'+l.apply+'<\/div>';\n    h += '<\/div>';\n  });\n  h += '<div style=\"font-size:11px;color:#C9CDD4;margin-top:8px\">说明：AI分析结论仅供辅助研判，不作为最终行政决定依据；引用法规请以正式文本及最新修订为准。<\/div>';\n  h += '<\/div><\/div>';\n  document.getElementById('rightPane2').innerHTML = h;\n}\n\nfunction switchRightAITab(idx){\n  var tabs = document.querySelectorAll('#rightP 法分类<\/b><br>涉及人身财产安全按紧急事件启动；涉及群体利益、舆情外溢按敏感事件会商；跨部门事项按多跨协同清单办理。<br><br><b>四、回访闭环<\/b><br>办结后 48 小时回访，二次投诉即升级复核，并写入案例库。<br><br><b>参考依据：<\/b>基层治理四平台事件分类规范；《关于维护新就业形态劳动者劳动保障权益的指导意见》<span class=\"ref-source\">参考来源：业务知识库 | 法律法规库<\/span>'\n  },\n  {\n    q:'网约车抽成争议应依据哪些条款约谈平台？',\n    a:'约谈网约车平台抽成争议，建议重点引用以下条款并形成会商纪要：<br><br><b>一、行业管理<\/b><br>《网络预约出租汽车经营服务管理暂行办法》第 18 条：平台应合理确定计价规则，并向驾驶员明示抽成比例及计算方式。<br><br><b>二、劳动保障<\/b><br>《关于维护新就业形态劳动者劳动保障权益的指导意见》：平台不得利用优势地位侵害劳动者报酬权益，抽成调整应履行告知程序。<br><br><b>三、市场监管<\/b><br>《电子商务法》《网络交易监督管理办法》：交易规则变更应公开、公示，不得虚假或隐瞒计价方式。<br><br><b>约谈动作建议：<\/b>由交通运输部门牵头，市监、人社参加；要求 7 日内公示抽成规则，建立司机申诉通道，并书面反馈整改。<span class=\"ref-source\">参考来源：法律法规库 | 平台规则库 | 历史案例库<\/span>'\n  },\n  {\n    q:'快递员反映小区禁停怎么办？',\n    a:'针对快递配送通道受阻、小区禁停问题，建议按「现场—机制—规划」三步处置：<br><br><b>一、现场协调<\/b><br>联系物业和街道，开辟即停即走临停点，设置标识，明确配送时段。<br><br><b>二、机制建设<\/b><br>推广「快递友好社区」，将临时停靠纳入社区公约和物业考核，减少反复劝离。<br><br><b>三、跨部门联动<\/b><br>城管、住建指导点位设置，交警视情增加高峰临时车位。<br><br><b>参考依据：<\/b>《快递暂行条例》第 25 条；《城市配送车辆通行管理办法》第 12 条<span class=\"ref-source\">参考来源：业务知识库 | 历史案例库 | 区域治理库<\/span>'\n  },\n  {\n    q:'外卖骑手工伤如何快速理赔？',\n    a:'外卖骑手工伤/职业伤害理赔难，建议走「快认、快赔、快回访」：<br><br><b>一、关系认定<\/b><br>人社牵头核实用工与参保情况；未参保的，督促平台按职业伤害保障试点及时申报。<br><br><b>二、绿色通道<\/b><br>通过「小哥码」一键报案，材料一次收齐，目标将平均理赔周期由约 18 天压至 7 天左右。<br><br><b>三、争议联处<\/b><br>平台推诿的，市监、人社联合约谈，明确垫付与追偿责任，避免骑手反复投诉。<br><br><b>参考依据：<\/b>《关于维护新就业形态劳动者劳动保障权益的指导意见》；职业伤害保障试点政策<span class=\"ref-source\">参考来源：业务知识库 | 法律法规库 | 历史案例库<\/span>'\n  }\n];\n\nfunction renderPresets(){\n  var box=document.getElementById('chatPresets');\n  if(!box) return;\n  var h='';\n  PRESET_QS.forEach(function(item,i){\n    h+='<button type=\"button\" class=\"preset-q\" title=\"'+escHtml(item.q)+'\" onclick=\"askPreset('+i+')\">'+escHtml(item.q)+'<\/button>';\n  });\n  box.innerHTML=h;\n}\n\nfunction askPreset(i){\n  var item=PRESET_QS[i];\n  if(!item) return;\n  var input=document.getElementById('chatInput');\n  if(input) input.value=item.q;\n  sendMsg();\n}\n\nvar chatBusy=false;\nfunction sendMsg(){\n  var inpu ){var n=0;(list||[]).forEach(function(x){n+=x;});return n;}\nfunction qFmt(n){return String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g,',');}\nfunction qSplit(total, weights){\n  var n=weights.length, out=[], i;\n  for(i=0;i<n;i++) out.push(0);\n  if(total<=0||!n) return out;\n  var sum=qSum(weights);\n  if(sum<=0){out[0]=total;return out;}\n  var used=0;\n  for(i=0;i<n;i++){out[i]=Math.floor(total*weights[i]/sum);used+=out[i];}\n  var left=total-used;\n  var order=weights.map(function(w,idx){return idx;});\n  order.sort(function(a,b){return weights[b]-weights[a]||a-b;});\n  for(var k=0;k<left;k++) out[order[k%n]]++;\n  return out;\n}\nfunction qBalance(reasonParts, targets){\n  var R=reasonParts.length, T=targets.length, guard=0;\n  function townBad(t){\n    var s=0;\n    for(var r=0;r<R;r++) s+=reasonParts[r][t];\n    return s;\n  }\n  while(guard++<20000){\n    var poor=-1, rich=-1, poorGap=0, richGap=0;\n    for(var t=0;t<T;t++){\n      var gap=townBad(t)-targets[t];\n      if(gap<poorGap){poor=t;poorGap=gap;}\n      if(gap>richGap){rich=t;richGap=gap;}\n    }\n    if(poor<0||rich<0) break;\n    var moved=false;\n    for(var r=0;r<R;r++){\n      if(reasonParts[r][rich]>0){\n        reasonParts[r][rich]--;\n        reasonParts[r][poor]++;\n        moved=true;\n        break;\n      }\n    }\n    if(!moved) break;\n  }\n}\nvar qPlanCache={};\nfunction qTownPlan(month, areaIndex){\n  var key=month+'|'+areaIndex;\n  if(qPlanCache[key]) return qPlanCache[key];\n  var area=Q_AREAS[areaIndex];\n  var total=qAreaTotals(month)[areaIndex];\n  var row=qMatrix(month)[areaIndex];\n  var weights=area.towns.map(function(t){return t.w;});\n  var reasonParts=row.map(function(c){return qSplit(c, weights);});\n  var bad=qSum(row);\n  qBalance(reasonParts, qSplit(bad, weights));\n  var validParts=qSplit(Math.max(0, total-bad), weights);\n  var townBad=area.towns.map(function(_,ti){\n    var s=0;\n    reasonParts.forEach(function(parts){s+=parts[ti];});\n    return s;\n  });\n  var townT eaIndex, index){\n  var plan=qTownPlan(month, areaIndex);\n  for(var ti=0;ti<plan.townSpans.length;ti++){\n    var spans=plan.townSpans[ti];\n    for(var s=0;s<spans.length;s++){\n      var sp=spans[s];\n      if(index<sp.start||index>=sp.start+sp.count) continue;\n      var vp=qVillagePlan(month, areaIndex, ti);\n      for(var vi=0;vi<vp.spans.length;vi++){\n        var list=vp.spans[vi];\n        for(var k=0;k<list.length;k++){\n          var vsp=list[k];\n          if(index>=vsp.start&&index<vsp.start+vsp.count) return {town:ti,village:vi};\n        }\n      }\n    }\n  }\n  return {town:0,village:0};\n}\nfunction qMonthKey(){\n  var sel=document.getElementById('qualityMonth');\n  return sel&&Q_MONTH_TOTAL[sel.value]?sel.value:'2026年6月';\n}\nfunction qAreaTotals(month){\n  var total=Q_MONTH_TOTAL[month];\n  var raw=Q_AREAS.map(function(a){return Math.round(a.n*total/18400);});\n  raw[0]+=total-qSum(raw);\n  return raw;\n}\nfunction qMatrix(month){\n  var f=Q_MONTH_TOTAL[month]/18400;\n  return Q_MATRIX.map(function(row){return row.map(function(n){return Math.round(n*f);});});\n}\nfunction qNum(month, areaIndex, mode, townIndex, villageIndex){\n  if(townIndex==null) townIndex=-1;\n  if(villageIndex==null) villageIndex=-1;\n  return '<span class=\"q-num\" onclick=\"openQualityList(\\''+month+'\\','+areaIndex+',\\''+mode+'\\','+townIndex+','+villageIndex+')\">';\n}\nfunction qFillAreaOptions(){\n  var sel=document.getElementById('qualityArea');\n  if(!sel||sel.options.length>1) return;\n  Q_AREAS.forEach(function(a,i){\n    var op=document.createElement('option');\n    op.value=String(i);\n    op.textContent=a.name;\n    sel.appendChild(op);\n  });\n}\nfunction qOrgSelection(){\n  var area=document.getElementById('qualityArea');\n  var town=document.getElementById('qualityTown');\n  var areaIndex=area&&area.value!==''?parseInt(area.value,10):-1;\n  var townIndex=town&&town.value!==''?parseInt(town.value,10):-1;\n  if(!(areaIndex>=0)) townIndex=-1;\n  return {areaIndex:areaIndex,townIndex:townIndex};\n}\nfunction qAreaChange(){\n  var area=document.getElementById('qualityArea');\n  var town=document.getElementById('qualityTown');\n  var html='<option value=\"\">全部乡镇<\/option>';\n  if(area&&area.value!==''){\n    Q_AREAS[parseInt(area.value,10)].towns.forEach(function(t,i){\n      html+='<option value=\"'+i+'\">'+t.name+'<\/option>';\n    });\n    town.disabled=false;\n  }else if(town){\n    town.disabled=true;\n  }\n  if(town) town.innerHTML=html;\n  renderQuality();\n}\nfunction qUnitStats(month, unit){\n  if(unit.areaIndex<0){\n    var totals=qAreaTotals(month);\n    var matrix=qMatrix(month);\n    var reasons=Q_RULES.map(function(_,ri){return qSum(matrix.map(function(row){return row[ri];}));});\n    return {total:qSum(totals),bad:qSum(reasons),reasons:reasons};\n  }\n  if(unit.townIndex<0){\n    var row=qMatrix(month)[unit.areaIndex];\n    return {total:qAreaTotals(month)[unit.areaIndex],bad:qSum(row),reasons:row.slice()};\n  }\n  if(unit.villageIndex<0){\n    var plan=qTownPlan(month, unit.areaIndex);\n    var reasons=plan.reasonParts.map(function(parts){return parts[unit.townIndex];});\n    return {total:plan.townTotal[unit.townIndex],bad:plan.townBad[unit.townIndex],reasons:reasons};\n  }\n  return qVillageStats(month, unit.areaIndex, unit.townIndex)[unit.villageIndex];\n}\nfunction renderQuality(){\n  var head=document.getElementById('qualityHead');\n  var body=document.getElementById('qualityBody');\n  if(!head||!body) return;\n  qFillAreaOptions();\n  var month=qMonthKey();\n  var sel=qOrgSelection();\n  var units=[];\n  var parent;\n  var footCount=10;\n  var footUnit='个县（市、区）';\n  if(sel.areaIndex<0){\n    Q_AREAS.forEach(function(a,i){units.push({name:a.name,areaIndex:i,townIndex:-1,villageIndex:-1});});\n    parent={name:'金华市',areaIndex:-1,townIndex:-1,villageIndex:-1};\n  }else if(sel.townIndex<0){\n    var area=Q_AREAS[sel.areaIndex];\n    area.towns.forEach(function(t,i){units.push({name:t.name,areaIndex:sel.are ion qSegments(month, areaIndex, mode, townIndex, villageIndex){\n  if(townIndex==null) townIndex=-1;\n  if(villageIndex==null) villageIndex=-1;\n  if(areaIndex<0||townIndex<0){\n    var totals=qAreaTotals(month);\n    var matrix=qMatrix(month);\n    var ids=areaIndex<0?totals.map(function(_,i){return i;}):[areaIndex];\n    var segs=[];\n    ids.forEach(function(i){\n      var row=matrix[i];\n      var start=0,count=0;\n      if(mode==='all'){count=totals[i];}\n      else if(mode==='bad'){count=qSum(row);}\n      else {\n        var rule=parseInt(mode,10);\n        for(var k=0;k<rule;k++) start+=row[k];\n        count=row[rule]||0;\n      }\n      if(count>0) segs.push({area:i,start:start,count:count});\n    });\n    return segs;\n  }\n  var plan=qTownPlan(month, areaIndex);\n  var spans=plan.townSpans[townIndex].filter(function(sp){\n    if(mode==='all') return true;\n    if(mode==='bad') return sp.reason>=0;\n    return sp.reason===parseInt(mode,10);\n  });\n  if(villageIndex<0) return spans;\n  var vp=qVillagePlan(month, areaIndex, townIndex);\n  return vp.spans[villageIndex].filter(function(sp){\n    if(mode==='all') return true;\n    if(mode==='bad') return sp.reason>=0;\n    return sp.reason===parseInt(mode,10);\n  });\n}\nfunction qSegCount(segs){return qSum(segs.map(function(s){return s.count;}));}\nfunction qLocate(segs, offset){\n  var left=offset;\n  for(var i=0;i<segs.length;i++){\n    if(left<segs[i].count) return {area:segs[i].area,index:segs[i].start+left};\n    left-=segs[i].count;\n  }\n  return null;\n}\nfunction qReasonAt(row, index){\n  var acc=0;\n  for(var i=0;i<row.length;i++){\n    acc+=row[i];\n    if(index<acc) return i;\n  }\n  return -1;\n}\nfunction qPeerIndex(month, areaIndex, index){\n  var row=qMatrix(month)[areaIndex];\n  if(qReasonAt(row, index)!==8) return -1;\n  var start=0;\n  for(var i=0;i<8;i++) start+=row[i];\n  var count=row[8];\n  if(count<2) return -1;\n  var offset=index-start;\n  var peerOff=offset%2===0?offset+1:offset-1; justCurrent').textContent=cur;\n  var sel=document.getElementById('qAdjustReason');\n  var html='<option value=\"-1\">抽检通过<\/option>';\n  Q_RULES.forEach(function(r,i){html+='<option value=\"'+i+'\">'+qEsc(r.name)+'<\/option>';});\n  sel.innerHTML=html;\n  sel.value=String(ev.reason);\n  document.getElementById('qAdjustNote').value=ev.adjusted?ev.adjusted.note:'';\n  qSyncAdjustExplain();\n  document.getElementById('qAdjustModal').classList.add('show');\n}\nfunction openQualityAdjustFromDrawer(){\n  if(!qDrawerEv||!qDrawerMonth) return;\n  openQualityAdjust(qDrawerMonth, qDrawerEv.areaIndex, qDrawerEv.index);\n}\nfunction closeQualityAdjust(){\n  document.getElementById('qAdjustModal').classList.remove('show');\n  qAdjustTarget=null;\n}\nfunction qSyncAdjustExplain(){\n  var sel=document.getElementById('qAdjustReason');\n  var row=document.getElementById('qAdjustExplainRow');\n  var box=document.getElementById('qAdjustExplain');\n  var i=parseInt(sel.value,10);\n  var text=i>=0?Q_RULES[i].explain:'';\n  if(text){row.style.display='block';box.textContent=text;}\n  else row.style.display='none';\n}\nfunction submitQualityAdjust(){\n  if(!qAdjustTarget) return;\n  var ev=qEventAt(qAdjustTarget.month, qAdjustTarget.areaIndex, qAdjustTarget.index);\n  var reason=parseInt(document.getElementById('qAdjustReason').value,10);\n  var note=document.getElementById('qAdjustNote').value.replace(/^\\s+|\\s+$/g,'');\n  if(reason===ev.reason){\n    showToast('请选择调整后的判定','info');\n    return;\n  }\n  if(!note){\n    showToast('请填写调整说明','info');\n    return;\n  }\n  qAdjust[ev.id]={reason:reason,note:note,by:'张三',time:qNowText(),origin:ev.originReason};\n  var month=qAdjustTarget.month, areaIndex=qAdjustTarget.areaIndex, index=qAdjustTarget.index, id=ev.id;\n  closeQualityAdjust();\n  if(qView) renderQualityList();\n  if(qDrawerEv&&qDrawerEv.id===id) qOpenDrawer(qEventAt(month, areaIndex, index), month, true);\n  showToast('无效判定已调整','success');\n}\nvar qAdjustTarget=null;\nfunction qOpenDrawer(ev, month, keepTabs){\n  qDrawerEv=ev;\n  qDrawerMonth=month;\n  document.getElementById('qDrawerId').textContent=ev.id;\n  var star=document.getElementById('qDrawerStar');\n  star.textContent=qStars[ev.id]?'★':'☆';\n  star.className='star-btn'+(qStars[ev.id]?' active':'');\n  var statusEl=document.getElementById('qDrawerStatus');\n  statusEl.textContent=ev.status;\n  var statusMap={'办理中':'background:#FFF1E8;color:#FF7D29','待受理':'background:#FFF7E8;color:#FF7D00','已结案':'background:#E8F7ED;color:#00B42A'};\n  statusEl.style.cssText=statusMap[ev.status]||statusMap['办理中'];\n  if(!keepTabs){\n    qSwitchLeft(0);\n    qSwitchRight(0);\n  }\n  qRenderBasic(ev);\n  qRenderDetail(ev, month);\n  qRenderTrack(ev);\n  qRenderAttach(ev);\n  qRenderAI(ev);\n  document.getElementById('qDrawerMask').classList.add('show');\n  document.getElementById('qDrawer').classList.add('show');\n}\nfunction openQualityEvent(month, areaIndex, index){\n  qOpenDrawer(qEventAt(month, areaIndex, index), month);\n}\nfunction closeQualityModal(){\n  closeQualityAdjust();\n  qCloseDrawer();\n  document.getElementById('qualityModal').classList.remove('show');\n}\nfunction renderQualityList(){\n  if(!qView) return;\n  var segs=qSegments(qView.month, qView.areaIndex, qView.mode, qView.townIndex, qView.villageIndex);\n  var total=qSegCount(segs);\n  var pageSize=10;\n  var pages=Math.max(1, Math.ceil(total/pageSize));\n  if(qView.page>pages) qView.page=pages;\n  if(qView.page<1) qView.page=1;\n  var scope=qView.areaIndex<0?['金华市']:[Q_AREAS[qView.areaIndex].name];\n  if(qView.townIndex>=0) scope.push(Q_AREAS[qView.areaIndex].towns[qView.townIndex].name);\n  if(qView.villageIndex>=0) scope.push(Q_AREAS[qView.areaIndex].towns[qView.townIndex].villages[qView.villageIndex].name);\n  var title=scope.join(' · ')+' · ';\n  if(qView.mode==='all') title+='检查事件';\n  else if(qView.mode==='bad') title+='无效事件';\n  else title+=Q_RULES[parseInt(qView.mode,10)].name;\n  document.getElementById('qualityModalTitle s.area+','+pos.index+')\">'+ev.id+'<\/span><\/td>';\n    html+='<td>'+ev.cat+'<\/td>';\n    html+='<td class=\"q-desc\" title=\"'+qEsc(ev.desc)+'\">'+qEsc(ev.desc)+'<\/td>';\n    html+='<td>'+qLevelHtml(ev.level)+'<\/td>';\n    html+='<td class=\"q-org\" title=\"'+qEsc(ev.org)+'\">'+qEsc(ev.org)+'<\/td>';\n    html+='<td>'+ev.reportOrg+'<\/td>';\n    html+='<td>'+ev.reporter+'<\/td>';\n    html+='<td>'+ev.time+'<\/td>';\n    if(showReason) html+='<td class=\"q-note\">'+reasonHtml+'<\/td>';\n    if(showNote) html+='<td class=\"q-note\">'+(ev.note||'—')+'<\/td>';\n    if(showPeer) html+='<td>'+qPeerHtml(qView.month, ev)+'<\/td>';\n    html+='<td class=\"q-act\"><button type=\"button\" class=\"btn q-adjust-btn\" onclick=\"openQualityAdjust(\\''+qView.month+'\\','+pos.area+','+pos.index+')\">调整<\/button>';\n    if(ev.adjusted&&!showReason){\n      var adjName=qJudgeName(ev.reason);\n      html+='<div class=\"q-adjusted\" title=\"'+qEsc('已调整为'+adjName)+'\">已调整为'+qEsc(adjName)+'<\/div>';\n    }\n    html+='<\/td><\/tr>';\n  }\n  html+='<\/tbody><\/table><\/div>';\n  html+='<div class=\"pagination\" style=\"padding:14px 0 0;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--tx3)\">';\n  html+='<span>第 '+qView.page+' / '+pages+' 页<\/span><span>';\n  html+='<button class=\"btn\" style=\"height:28px;padding:0 10px\" '+(qView.page<=1?'disabled':'')+' onclick=\"qListPage('+(qView.page-1)+')\">上一页<\/button> ';\n  html+='<button class=\"btn\" style=\"height:28px;padding:0 10px\" '+(qView.page>=pages?'disabled':'')+' onclick=\"qListPage('+(qView.page+1)+')\">下一页<\/button>';\n  html+='<\/span><\/div>';\n  document.getElementById('qualityModalBody').innerHTML=html;\n}\nfunction qListPage(page){\n  if(!qView) return;\n  qView.page=page;\n  renderQualityList();\n}\nfunction qCsvCell(v){\n  var s=v==null?'':String(v);\n  if(/[\",\\n\\r]/.test(s)) s='\"'+s.replace(/\"/g,'\"\"')+'\"';\n  return s;\n}\nfunction qDownloadCsv(filename, rows){\n  var text='\\uFEFF'+rows.map(function(r){return r.map(qCsvCell).join(',');}).join('\\r\\n');\n  var blob=new Blob([text],{type:'text/csv;charset=utf-8'});\n  var a=document.createElement('a');\n  a.href=URL.createObjectURL(blob);\n  a.download=filename;\n  document.body.appendChild(a);\n  a.click();\n  setTimeout(function(){\n    URL.revokeObjectURL(a.href);\n    if(a.parentNode) a.parentNode.removeChild(a);\n  },1000);\n  showToast('已导出','success');\n}\nfunction qQualityUnits(){\n  var sel=qOrgSelection();\n  var units=[];\n  var parent;\n  if(sel.areaIndex<0){\n    Q_AREAS.forEach(function(a,i){units.push({name:a.name,areaIndex:i,townIndex:-1,villageIndex:-1});});\n    parent={name:'金华市',areaIndex:-1,townIndex:-1,villageIndex:-1};\n  }else if(sel.townIndex<0){\n    var area=Q_AREAS[sel.areaIndex];\n    area.towns.forEach(function(t,i){units.push({name:t.name,areaIndex:sel.areaIndex,townIndex:i,villageIndex:-1});});\n    parent={name:area.name,areaIndex:sel.areaIndex,townIndex:-1,villageIndex:-1};\n  }else{\n    var town=Q_AREAS[sel.areaIndex].towns[sel.townIndex];\n    town.villages.forEach(function(v,i){units.push({name:v.name,areaIndex:sel.areaIndex,townIndex:sel.townIndex,villageIndex:i});});\n    parent={name:town.name,areaIndex:sel.areaIndex,townIndex:sel.townIndex,villageIndex:-1};\n  }\n  return {units:units,parent:parent};\n}\nfunction exportQualityTable(){\n  var month=qMonthKey();\n  var pack=qQualityUnits();\n  var stats=pack.units.map(function(u){return qUnitStats(month,u);});\n  var parentStats=qUnitStats(month,pack.parent);\n  function rateOf(bad, total){return total?((bad/total)*100).toFixed(1)+'%':'0.0%';}\n  var head=['指标', pack.parent.name];\n  pack.units.forEach(function(u){head.push(u.name);});\n  function line(label, pick){\n    var row=[label, pick(parentStats)];\n    stats.forEach(function(s){row.push(pick(s));});\n    return row;\n  }\n  var rows=[head];\n  rows.push(line('检查事件数', function(s){return s.total;}));\n  rows.push(line('无效事件数', function(s){return s.bad;}));\n  rows.push(line('无效率', function(s){return rateOf(s.bad, s.total);}));\n  Q_RULES.forEach(function(r,ri){\n    rows.push(line(r.name, function(s){return s.reasons[ri];}));\n  });\n  var sel=qOrgSelection();\n  var parts=['事件质检', month];\n  if(sel.areaIndex>=0) parts.push(Q_AREAS[sel.areaIndex].name);\n  if(sel.townIndex>=0) parts.push(Q_AREAS[sel.areaIndex].towns[sel.townIndex].name);\n  qDownloadCsv(parts.join('-')+'.csv', rows);\n}\nfunction exportQualityList(){\n  if(!qView) return;\n  var segs=qSegments(qView.month, qView.areaIndex, qView.mode, qView.townIndex, qView.villageIndex);\n  var total=qSegCount(segs);\n  var rows=[['事件编号','三级分类','事件描述','事件等级','所属组织','上报组织','上报人','事发时间','无效原因','无效判定说明','关联事件']];\n  for(var i=0;i<total;i++){\n    var pos=qLocate(segs, i);\n    var ev=qEventAt(qView.month, pos.area, pos.index);\n    var reasonText=ev.reason<0?(ev.adjusted?'抽检通过':''):Q_RULES[ev.reason].name;\n    var peer=ev.peer>=0?qEventAt(qView.month, ev.areaIndex, ev.peer).id:'';\n    rows.push([ev.id,ev.cat,ev.desc,ev.level.name,ev.org,ev.reportOrg,ev.reporter,ev.time,reasonText,ev.note||'',peer]);\n  }\n  var scope=qView.areaIndex<0?['金华市']:[Q_AREAS[qView.areaIndex].name];\n  if(qView.townIndex>=0) scope.push(Q_AREAS[qView.areaIndex].towns[qView.townIndex].name);\n  if(qView.villageIndex>=0) scope.push(Q_AREAS[qView.areaIndex].towns[qView.townIndex].villages[qView.villageIndex].name);\n  var kind=qView.mode==='all'?'检查事件':(qView.mode==='bad'?'无效事件':Q_RULES[parseInt(qView.mode,10)].name);\n  qDownloadCsv(['事件质检',qView.month].concat(scope,[kind]).join('-')+'.csv', rows);\n}\nfunction renderReportTable(){\n  renderMonthReports();\n  renderTopicReports();\n}\nfunction renderMonthReports(){\n  var tb=document.getElementById('monthReportBody');\n  var cnt=document.getElementById('monthReportCount');\n  if(!tb) return;\n  var rangeEl=document.getElementById('monthRange');\n  var range=rangeEl?rangeEl.value:'近6个月';\n  var rows=reportRows('月报').filter(function(x){\n    var y=(x.d.period||'').slice(0,4);\n    if(range==='2026年') return y==='2026';\n    if(range==='2025年') return y==='2025';\n    return true;\n  });\n  if(!rows.length){\n    tb.innerHTML='<tr><td colspan=\"11\" style=\"text-align:center;color:var(--tx3);padding:28px 0\">该时段暂无周期月报<\/td><\/tr>';\n    if(cnt) cnt.textContent='0';\n    return;\n  }\n  var html='';\n  rows.forEach(function(x){\n    var d=x.d;\n    html+='<tr>';\n    html+='<td style=\"font-weight:500\">'+d.period+'<\/td>';\n    html+='<td>'+unitNum(d.total,'件')+'<\/td>';\n    html+='<td>'+d.rate+'<\/td>';\n    html+='<td>'+unitNum(d.key,'件')+'<\/td>';\n    html+='<td>'+d.avg+'<\/td>';\n    html+='<td>'+unitNum(d.overdue?d.overdue.total:'—','件')+'<\/td>';\n    html+='<td>'+unitNum(d.repeat?d.repeat.total:'—','件')+'<\/td>';\n    html+='<td>'+unitNum(d.silentGrids?d.silentGrids.total:'—','个')+'<\/td>';\n    html+='<td><span class=\"tag '+d.trendCls+'\">'+d.trendTag+'<\/span><\/td>';\n    html+='<td style=\"color:var(--tx3);font-size:12px\">'+d.genTime+'<\/td>';\n    html+='<td><span style=\"color:var(--accent);cursor:pointer;font-size:12px\" onclick=\"openReportDetail('+x.i+')\">查看详情<\/span><\/td>';\n    html+='<\/tr>';\n  });\n  tb.innerHTML=html;\n  if(cnt) cnt.textContent=String(rows.length);\n}\nfunction renderTopicReports(){\n  var tb=document.getElementById('topicReportBody');\n  var cnt=document.getElementById('topicReportCount');\n  if(!tb) return;\n  var flt=document.getElementById('topicTypeFilter');\n  var tp=flt?flt.value:'';\n  var rows=reportRows('专题').filter(function(x){return !tp || x.d.type===tp;});\n  if(!rows.length){\n    tb.innerHTML='<tr><td colspan=\"9\" style=\"text-align:center;color:var(--tx3);padding:28px 0\">暂无该类型专题报告<\/td><\/tr>';\n    if(cnt) cnt.textContent='0';\n    return;\n  }\n  var html='';\n  rows.forEach(function(x){\n    var d=x.d;\n    html+='<tr>';\n    html+='<td style=\"font-weight:500\">'+d.title+'<\/td>';\n    html+='<td><span class=\"tag tag-info .6_AI助手.html#3\">周期月报<\/a>\n    <a class=\"sub-item\" data-section=\"4\" href=\"5.6_AI助手.html#4\">专题智报<\/a>\n    <a class=\"sub-item\" data-section=\"5\" href=\"5.6_AI助手.html#5\">事件质检<\/a>\n  <\/div>\n<\/aside>\n\n<main class=\"main\">\n  <div class=\"breadcrumb\">事件管理 / <b>处置评价体系<\/b><\/div>\n  <div class=\"page-tabs\">\n    <button class=\"pt on\" data-tab=\"0\" onclick=\"switchEvalTab(0)\">评价总览<\/button>\n    <button class=\"pt\" data-tab=\"1\" onclick=\"switchEvalTab(1)\">指标体系<\/button>\n    <button class=\"pt\" data-tab=\"2\" onclick=\"switchEvalTab(2)\">事件评价<\/button>\n  <\/div>\n\n  <div id=\"evalTab0\">\n    <div class=\"kpi-grid\">\n      <div class=\"kpi\"><div class=\"k-label\">综合处置评分<\/div><div class=\"k-val\">86.4<em>分<\/em><\/div><div class=\"k-sub up\">↑ 较上月 +1.8<\/div><\/div>\n      <div class=\"kpi\"><div class=\"k-label\">按时办结率<\/div><div class=\"k-val\">94.2<em>%<\/em><\/div><div class=\"k-sub up\">↑ +2.5 pct<\/div><\/div>\n      <div class=\"kpi\"><div class=\"k-label\">群众满意率<\/div><div class=\"k-val\">92.4<em>%<\/em><\/div><div class=\"k-sub up\">↑ +1.2 pct<\/div><\/div>\n      <div class=\"kpi\"><div class=\"k-label\">闭环回访率<\/div><div class=\"k-val\">88.7<em>%<\/em><\/div><div class=\"k-sub down\">↓ -0.6 pct<\/div><\/div>\n      <div class=\"kpi\"><div class=\"k-label\">评价覆盖率<\/div><div class=\"k-val\">96.1<em>%<\/em><\/div><div class=\"k-sub\">本月已评价 1,236 件<\/div><\/div>\n    <\/div>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <div class=\"card-header\"><div class=\"title\">五维得分（AI模型）<\/div><span class=\"muted\">近30天 · 权重见指标体系<\/span><\/div>\n        <div class=\"card-body\" id=\"overviewDims\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <div class=\"card-header\"><div class=\"title\">部门办结事件数<\/div><span class=\"muted\">本月已办结件<\/span><\/div>\n        <div class=\"card-body\" id=\"deptRank\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <div class=\"card-header\"><div class=\"title\">评价等级分布<\/div><\/div>\n        <div class=\"card-body\" id=\"gradeDist\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <div class=\"card-header\"><div class=\"title\">群体类型评价对比<\/div><\/div>\n        <div class=\"card-body\" id=\"groupDist\"><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"evalTab1\" style=\"display:none\">\n    <div class=\"card\">\n      <div class=\"card-header\">\n        <div class=\"title\">评价指标体系<\/div>\n        <div>\n          <button class=\"btn\" onclick=\"resetWeights()\">恢复默认权重<\/button>\n          <button class=\"btn btn-primary\" onclick=\"saveWeights()\">保存权重<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"card-body\">\n        <div class=\"formula\" id=\"formulaBox\"><\/div>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px\" id=\"indCards\"><\/div>\n        <p class=\"muted\" style=\"margin-top:12px\">权重合计须为 100%。调整后将即时重算列表中的综合得分与等级（演示数据）。<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"evalTab2\" style=\"display:none\">\n    <div class=\"card\" style=\"margin-bottom:0\">\n      <div class=\"card-header\">\n        <div class=\"title\">事件处置评价清单<\/div>\n        <div>\n          <button class=\"btn\" onclick=\"batchReEval()\"><svg class=\"svg-icon svg-icon-16\"><use href=\"#icon-sync\"/><\/svg> AI批量重评<\/button>\n          <button class=\"btn\" onclick=\"exportList()\"><svg class=\"svg-icon svg-icon-16\"><use href=\"#icon-download\"/><\/svg> 导出<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"filter-bar\">\n        <label>事件编号<\/label><input type=\"text\" id=\"fId\" placeholder=\"请输入编号\">\n        <label>群体类型<\/label>\n        <select id=\"fGroup\"><option>全部<\/option><option>网约车司机<\/option><option>即时配送人员<\/option><option>快递物流人员<\/option><option>货运司机<\/option><option>出租车司机<\/option><option>互联网从业人员<\/option><\/select>\n        <label>评价等级<\/label>\n        <select id=\"fGrade\"><option>全部<\/option><option>优<\/option><option>良<\/option><option>中<\/option><option>差<\/option><\/select>\n        <label>评价状态<\/label>\n        <select id=\"fStatus\"><option>全部<\/option><option>已评价<\/option><option>待回访<\/option><\/select>\n        <button class=\"btn btn-primary\" onclick=\"renderEventTable()\">查询<\/button>\n        <button class=\"btn\" onclick=\"resetEventFilter()\">重置<\/button>\n      <\/div>\n      <div class=\"op-scroll\" style=\"overflow-x:auto\">\n        <table>\n          <thead><tr>\n            <th>事件编号<\/th><th>事件简述<\/th><th>群体类型<\/th><th>承办单位<\/th>\n            <th>综合得分<\/th><th>等级<\/th><th>满意<\/th><th>状态<\/th><th>评价时间<\/th><th>操作<\/th>\n          <\/tr><\/thead>\n          <tbody id=\"evBody\"><\/tbody>\n        <\/table>\n      <\/div>\n      <div class=\"pagination\"><span id=\"evCount\"><\/span><span>AI 按指标体系自动打分，可人工复核<\/span><\/div>\n    <\/div>\n  <\/div>\n\n<\/main>\n\n<div class=\"drawer-mask\" id=\"drawerMask\" onclick=\"closeDrawer()\"><\/div>\n<div class=\"drawer\" id=\"drawer\">\n  <div class=\"drawer-h\">\n    <div class=\"dt\" id=\"drawerTitle\">事件评价详情<\/div>\n    <button class=\"close\" onclick=\"closeDrawer()\">✕<\/button>\n  <\/div>\n  <div class=\"drawer-b\" id=\"drawerBody\"><\/div>\n<\/div>\n\n<script>\nvar DIMS = [\n  {key:'time', name:'处置时效', w:25, color:'#165DFF', desc:'签收、首接、办结是否按时；超时扣分，提前办结加分。覆盖上报到办结全流程节点。'},\n  {key:'quality', name:'办理质量', w:25, color:'#00B42A', desc:'事实核查完整度、适用依据准确性、答复口径一致性、一次办结率。'},\n  {key:'coop', name:'协同效能', w:15, color:'#722ED1', desc:'多跨事件会商时效、职责边界清晰度、转办次数与推诿情况。'},\n  {key:'sat', name:'群众满意', w:20, color:'#FF7D00', desc:'回访满意度、二次投诉率、诉求实质解决程度。'},\n  {key:'loop', name:'闭环回访', w:15, color:'#14C9C9', desc:'48 小时回访完成率、整改落实核验、案例入库完整性。'}\n];\n\nvar EVENTS = [\n  {id:'EVT20260628012', desc:'网约车司机投诉平台抽成上调未公示', group:'网约车司机', org:'婺城区交通运输局', scores:{time:88,quality:90,coop:86,sat:92,loop:84}, sat:'满意', status:'已评价', time:'2026-06-29 16:20'},\n  {id:'EVT20260627008', desc:'外卖骑手交通事故理赔周期过长', group:'即时配送人员', org:'金东区人社局', scores:{time:76,quality:82,coop:80,sat:78,loop:74}, sat:'一般', status:'已评价', time:'2026-06-28 11:05'},\n  {id:'EVT20260626021', desc:'小区禁停导致快递末端配送受阻', group:'快递物流人员', org:'婺城区城管局', scores:{time:94,quality:91,coop:88,sat:95,loop:90}, sat:'很满意', status:'已评价', time:'2026-06-27 09:40'},\n  {id:'EVT20260625016', desc:'货车超限处罚标准解释不清', group:'货运司机', org:'武义县交通运输局', scores:{time:81,quality:79,coop:72,sat:70,loop:68}, sat:'一般', status:'待回访', time:'2026-06-26 15:12'},\n  {id:'EVT20260624009', desc:'出租车份子钱过高集体反映', group:'出租车司机', org:'东阳市交通运输局', scores:{time:85,quality:88,coop:91,sat:86,loop:83}, sat:'满意', status:'已评价', time:'2026-06-25 18:30'},\n  {id:'EVT20260623018', desc:'直播带货售后无门劳动关系模糊', group:'互联网从业人员', org:'金东区市场监管局', scores:{time:73,quality:77,coop:69,sat:65,loop:70}, sat:'不满意', status:'待回访', time:'2026-06-24 10:18'},\n  {id:'EVT20260622005', desc:'骑手高温作业防护与运力调度', group:'即时配送人员', org:'婺城区应急管理局', scores:{time:90,quality:87,coop:84,sat:89,loop:86}, sat:'满意', status:'已评价', time:'2026-06-23 14:02'},\n  {id:'EVT20260621033', desc:'驿站夜间分拣噪音扰民', group:'快递物流人员', org:'浦江县城管局', scores:{time:92,quality:85,coop:80,sat:88,loop:91}, sat:'满意', status:'已评价', time:'2026-06-22 08:55'},\n  {id:'EVT20260620014', desc:'网约车账号封禁申诉无复核通道', group:'网约车司机', org:'婺城区网信办', scores:{time:68,quality:74,coop:71,sat:62,loop:66}, sat:'不满意', status:'待回访', time:'2026-06-21 19:26'},\n  {id:'EVT20260619007', desc:'货运通道施工绕行成本上升', group:'货运司机', org:'金东区交通运输局', scores:{time:84,quality:83,coop:79,sat:81,loop:80}, sat:'满意', status:'已评价', time:'2026-06-20 13:41'}\n];\n\nvar currentEv = null;\n\nfunction toast(msg, ok){\n  var c=document.getElementById('toastContainer');\n  var t=document.createElement('div');\n  t.className='toast'+(ok?' ok':'');\n  t.textContent=msg;\n  c.appendChild(t);\n  setTimeout(function(){t.classList.add('show')},10);\n  setTimeout(function(){t.remove()},2200);\n}\n\nfunction switchEvalTab(i){\n  document.querySelectorAll('.page-tabs .pt').forEach(function(el,idx){el.classList.toggle('on', idx===i)});\n  for(var n=0;n<3;n++){\n    var p=document.getElementById('evalTab'+n);\n    if(p) p.style.display = n===i ? '' : 'none';\n  }\n}\n\nfunction totalW(){return DIMS.reduce(function(s,d){return s+Number(d.w)},0)}\n\nfunction calcScore(ev){\n  var s=0, w=totalW()||100;\n  DIMS.forEach(function(d){s += (ev.scores[d.key]||0) * d.w / w});\n  return Math.round(s*10)/10;\n}\n\nfunction gradeOf(score){\n  if(score>=90) return {g:'优', cls:'tag-a'};\n  if(score>=80) return {g:'良', cls:'tag-b'};\n  if(score>=70) return {g:'中', cls:'tag-c'};\n  return {g:'差', cls:'tag-d'};\n}\n\nfunction renderBars(list, valKey){\n  var max = Math.max.apply(null, list.map(function(x){return x[valKey]})) || 1;\n  var h='<div class=\"dim-list\">';\n  list.forEach(function(item){\n    var pct=Math.max(8, Math.round(item[valKey]/max*100));\n    h+='<div class=\"dim-row\"><span class=\"name\">'+item.name+'<\/span><div class=\"bar\"><i style=\"width:'+pct+'%;background:'+(item.color||'var(--accent)')+'\"><\/i><\/div><span class=\"num\">'+item[valKey]+(item.unit||'')+'<\/span><\/div>';\n  });\n  return h+'<\/div>';\n}\n\nfunction renderOverview(){\n  var dims = DIMS.map(function(d){\n    var avg = EVENTS.reduce(function(s,e){return s+(e.scores[d.key]||0)},0)/EVENTS.length;\n    return {name:d.name, val:Math.round(avg*10)/10, color:d.color};\n  });\n  document.getElementById('overviewDims').innerHTML = renderBars(dims, 'val');\n\n  var depts = [\n    {name:'婺城区交通运输局', n:286},{name:'金东区人社局', n:214},{name:'婺城区城管局', n:198},\n    {name:'东阳市交通运输局', n:167},{name:'武义县交通运输局', n:142},{name:'浦江县城管局', n:129}\n  ];\n  var rh='';\n  depts.forEach(function(d,i){\n    rh+='<div class=\"rank-item\"><span class=\"rk'+(i<3?' t':'')+'\">'+(i+1)+'<\/span><span class=\"nm\">'+d.name+'<\/span><span class=\"sc\">'+d.n+' 件<\/span><\/div>';\n  });\n  document.getElementById('deptRank').innerHTML=rh;\n\n  var gmap={优:0,良:0,中:0,差:0};\n  EVENTS.forEach(function(e){gmap[gradeOf(calcScore(e)).g]++});\n  document.getElementById('gradeDist').innerHTML = renderBars([\n    {name:'优 ≥90', val:gmap['优'], color:'#00B42A'},\n    {name:'良 80-89', val:gmap['良'], color:'#165DFF'},\n    {name:'中 70-79', val:gmap['中'], color:'#FF7D00'},\n    {name:'差 <70', val:gmap['差'], color:'#F53F3F'}\n  ], 'val');\n\n  var groups=['网约车司机','即时配送人员','快递物流人员','货运司机','出租车司机','互联网从业人员'];\n  var glist=groups.map(function(name){\n    var arr=EVENTS.filter(function(e){return e.group===name});\n    var avg=arr.length?arr.reduce(function(s,e){return s+calcScore(e)},0)/arr.length:0;\n    return {name:name, val:Math.round(avg*10)/10, color:'#165DFF'};\n  });\n  document.getElementById('groupDist').innerHTML=renderBars(glist,'val');\n}\n\nfunction renderFormula(){\n  var parts=DIMS.map(function(d){return d.name+'×'+d.w+'%'});\n  document.getElementById('formulaBox').innerHTML='综合得分 = <b>'+parts.join(' + ')+'<\/b><br>等级划分：优 ≥90 · 良 80–89 · 中 70–79 · 差 &lt;70。当前权重合计 <b>'+totalW()+'%<\/b>。';\n}\n\nfunction renderIndCards(){\n  var h='';\n  DIMS.forEach(function(d,i){\n    h+='<div class=\"ind-card\"><div class=\"ih\"><span class=\"n\">'+d.name+'<\/span><span class=\"w\" id=\"wlab'+i+'\">权重 '+d.w+'%<\/span><\/div>';\n    h+='<p>'+d.desc+'<\/p>';\n    h+='<input type=\"range\" min=\"5\" max=\"40\" step=\"1\" value=\"'+d.w+'\" oninput=\"onWeight('+i+',this.value)\">';\n    h+='<\/div>';\n  });\n  document.getElementById('indCards').innerHTML=h;\n  renderFormula();\n}\n\nfunction onWeight(i,v){\n  DIMS[i].w=parseInt(v,10);\n  document.getElementById('wlab'+i).textContent='权重 '+DIMS[i].w+'%';\n  renderFormula();\n}\n\nfunction resetWeights(){\n  var def=[25,25,15,20,15];\n  DIMS.forEach(function(d,i){d.w=def[i]});\n  renderIndCards();\n  renderEventTable();\n  renderOverview();\n  toast('已恢复默认权重', true);\n}\n\nfunction saveWeights(){\n  if(totalW()!==100){toast('权重合计须为 100%，当前为 '+totalW()+'%');return}\n  renderEventTable();\n  renderOverview();\n  toast('指标体系已保存，评分已重算', true);\n}\n\nfunction filteredEvents(){\n  var id=(document.getElementById('fId').value||'').trim();\n  var g=document.getElementById('fGroup').value;\n  var gr=document.getElementById('fGrade').value;\n  var st=document.getElementById('fStatus').value;\n  return EVENTS.filter(function(e){\n    if(id && e.id.indexOf(id)<0) return false;\n    if(g!=='全部' && e.group!==g) return false;\n    if(gr!=='全部' && gradeOf(calcScore(e)).g!==gr) return false;\n    if(st!=='全部' && e.status!==st) return false;\n    return true;\n  });\n}\n\nfunction renderEventTable(){\n  var rows=filteredEvents();\n  var h='';\n  rows.forEach(function(e,i){\n    var sc=calcScore(e), gd=gradeOf(sc);\n    h+='<tr>';\n    h+='<td style=\"font-family:ui-monospace,monospace;font-size:12px\">'+e.id+'<\/td>';\n    h+='<td title=\"'+e.desc+'\">'+e.desc+'<\/td>';\n    h+='<td>'+e.group+'<\/td>';\n    h+='<td>'+e.org+'<\/td>';\n    h+='<td style=\"font-weight:600\">'+sc+'<\/td>';\n    h+='<td><span class=\"tag '+gd.cls+'\">'+gd.g+'<\/span><\/td>';\n    h+='<td>'+e.sat+'<\/td>';\n    h+='<td><span class=\"tag '+(e.status==='已评价'?'tag-done':'tag-wait')+'\">'+e.status+'<\/span><\/td>';\n    h+='<td style=\"color:var(--tx3);font-size:12px\">'+e.time+'<\/td>';\n    h+='<td><span class=\"link\" onclick=\"openEv(\\''+e.id+'\\')\">详情<\/span><span class=\"link\" onclick=\"reEvalOne(\\''+e.id+'\\')\">重评<\/span><\/td>';\n    h+='<\/tr>';\n  });\n  document.getElementById('evBody').innerHTML=h||'<tr><td colspan=\"10\" style=\"text-align:center;color:var(--tx3);padding:28px\">暂无符合条件的评价记录<\/td><\/tr>';\n  document.getElementById('evCount').textContent='共 '+rows.length+' 条';\n}\n\nfunction resetEventFilter(){\n  document.getElementById('fId').value='';\n  document.getElementById('fGroup').value='全部';\n  document.getElementById('fGrade').value='全部';\n  document.getElementById('fStatus').value='全部';\n  renderEventTable();\n}\n\nfunction findEv(id){for(var i=0;i<EVENTS.length;i++) if(EVENTS[i].id===id) return EVENTS[i]; return null}\n\nfunction openEv(id){\n  var e=findEv(id); if(!e) return;\n  currentEv=e;\n  var sc=calcScore(e), gd=gradeOf(sc);\n  document.getElementById('drawerTitle').textContent=e.id;\n  var h='';\n  h+='<div style=\"display:flex;align-items:center;gap:20px;margin-bottom:16px\">';\n  h+='<div><div class=\"score-big\">'+sc+'<\/div><div class=\"muted\">综合得分<\/div><\/div>';\n  h+='<div><span class=\"tag '+gd.cls+'\">'+gd.g+'<\/span><div class=\"muted\" style=\"margin-top:6px\">'+e.status+' · '+e.sat+'<\/div><\/div>';\n  h+='<\/div>';\n  h+='<div class=\"field\"><span class=\"fl\">事件简述<\/span><span class=\"fv\">'+e.desc+'<\/span><\/div>';\n  h+='<div class=\"field\"><span class=\"fl\">群体类型<\/span><span class=\"fv\">'+e.group+'<\/span><\/div>';\n  h+='<div class=\"field\"><span class=\"fl\">承办单位<\/span><span class=\"fv\">'+e.org+'<\/span><\/div>';\n  h+='<div class=\"field\"><span class=\"fl\">评价时间<\/span><span class=\"fv\">'+e.time+'<\/span><\/div>';\n  h+='<div class=\"ai-box\"><b>AI 评价说明：<\/b>按现行指标体系加权计算。';\n  if(gd.g==='差'||gd.g==='中') h+='短板主要在「'+weakDim(e)+'」，建议复核办理质量与回访闭环。';\n  else h+='各维度相对均衡，可作为同类事件参考案例入库。';\n  h+='<\/div>';\n  h+='<div style=\"font-weight:500;margin:8px 0 10px\">分维度得分<\/div>';\n  var bars=DIMS.map(function(d){return {name:d.name+'（'+d.w+'%）', val:e.scores[d.key], color:d.color}});\n  h+=renderBars(bars,'val');\n  h+='<div style=\"margin-top:18px;display:flex;gap:8px\">';\n  h+='<button class=\"btn btn-primary\" onclick=\"reEvalOne(\\''+e.id+'\\');openEv(\\''+e.id+'\\')\">AI重新评价<\/button>';\n  h+='<button class=\"btn\" onclick=\"exportOne()\">导出本单<\/button>';\n  h+='<\/div>';\n  document.getElementById('drawerBody').innerHTML=h;\n  document.getElementById('drawerMask').classList.add('show');\n  document.getElementById('drawer').classList.add('show');\n}\n\nfunction weakDim(e){\n  var min=999, name='办理质量';\n  DIMS.forEach(function(d){if(e.scores[d.key]<min){min=e.scores[d.key];name=d.name}});\n  return name;\n}\n\nfunction closeDrawer(){\n  document.getElementById('drawerMask').classList.remove('show');\

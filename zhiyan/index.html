ound:transparent;color:var(--tx)}\n.sidebar .menu-item.menu-group:hover .icon{transform:none}\n.sidebar .sub-menu.always-open{max-height:none !important;opacity:1 !important;overflow:visible;padding:2px 0 8px}\n/* —— Main —— */\n.main{margin-left:var(--side);margin-top:var(--top);padding:20px 24px 40px;min-height:calc(100vh - var(--top));background:var(--bg2)}\n@media (max-width:1440px){\n  .main{padding:16px 16px 32px}\n  .card-header{flex-wrap:wrap;gap:8px}\n}\n@media (min-width:1920px){\n  .main{padding:24px 32px 48px}\n}\n.breadcrumb{font-size:12px;color:var(--tx3);margin-bottom:14px;display:flex;align-items:center;gap:6px}\n.breadcrumb b{color:var(--tx);font-weight:500}\n.section-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--tx)}\n.section-title::before{content:'';width:3px;height:15px;background:linear-gradient(180deg,var(--primary-light),var(--primary));border-radius:2px;flex-shrink:0}\n.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}\n.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#fff,#FAFBFC)}\n.card-header .title{font-size:15px;font-weight:600}\n/* 群体分类事件总览 - 左右布局 */\n.pie-section{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;margin-bottom:24px}\n.pie-card{padding:20px}\n.pie-card .chart-area{display:flex;align-items:center;gap:20px;margin-top:12px}\n.pie-placeholder{width:120px;height:120px;border-radius:50%;position:relative;background:conic-gradient(var(--primary) 0% 32%,var(--warning) 32% 52%,var(--success) 52% 70%,var(--purple) 70% 82%,var(--danger) 82% 92%,var(--tx3) 92% 100%);flex-shrink:0}\n.pie-placeholder::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:var(--bg)}\n.pie-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:1}\n.pie-center .big{font-size:18px;font-weight:600;color:var(--tx)}\n.pie-center .sm{font-size:10px;color:var(--tx2)}\n.legend{display:flex;flex-direction:column;gap:8px;flex:1}\n.legend-item{display:flex;align-items:center;justify-content:space-between;font-size:12px;cursor:pointer;padding:6px 8px;border-radius:6px;transition:all .15s}\n.legend-item:hover{background:var(--bg2)}\n.legend-item.active{background:var(--info-bg)}\n.legend-item .left{display:flex;align-items:center;gap:6px}\n.legend-item .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}\n.legend-item .count{font-weight:500;color:var(--tx)}\n.legend-item .pct{color:var(--tx2);font-size:11px}\n/* Group Distribution Chart */\n.group-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg2)}\n.group-row:last-child{border-bottom:none}\n.group-row .g-name{width:90px;font-size:13px;color:var(--tx);font-weight:500;flex-shrink:0;display:flex;align-items:center;gap:6px}\n.group-row .g-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}\n.group-row .g-track{flex:1;min-width:0;height:22px;background:var(--bg2);border-radius:6px}\n.group-row .g-bar-wrap{height:100%;display:flex;border-radius:6px;overflow:hidden;max-width:100%}\n.group-row .g-bar-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:width .5s;min-width:0}\n.group-row .g-bar-seg span{opacity:0;transition:opacity .2s}\n.group-row:hover .g-bar-seg span{opacity:1}\n.group-row .g-total{width:50px;font-size:13px;font-weight:600;color:var(--tx);text-align:right;flex-shrink:0}\n.group-legend{display:flex;gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--bd)}\n.group-legend .gl-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}\n.group-legend .gl-dot{width:10px;height:10px;border-radius:2px}\n.tag-section{margin-bottom:24px}\n.tag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.tag-card{padding:20px}\n.tag-card .group-name{font-weight:500;font-size:15px;margin-bottom:4px}\n.tag-card .group-sub{font-size:12px;color:var(--tx2);margin-bottom:12px}\n.tag-list{display:flex;flex-wrap:wrap;gap:6px}\n.tag-label{padding:3px 10px;border-radius:var(--radius);font-size:12px;display:inline-flex;align-items:center;gap:4px}\n.tag-label .confidence{font-size:10px;color:var(--tx2);opacity:.8}\n.tag-label.blue{background:#F2F3F5;color:#1D2129}\n.tag-label.orange{background:#F2F3F5;color:#1D2129}\n.tag-label.green{background:#F2F3F5;color:#1D2129}\n.tag-label.purple{background:#F2F3F5;color:#1D2129}\n.tag-label.red{background:#F2F3F5;color:#1D2129}\n.tag-card .edit-keyword-btn{display:inline-flex;align-items:center;gap:4px;margin-top:10px;padding:4px 10px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx3);transition:all .15s}\n.tag-card .edit-keyword-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--primary-soft)}\ntable{width:100%;border-collapse:collapse}\n.tbl-scroll{overflow-x:auto;max-width:100%;scrollbar-width:thin;scrollbar-color:#C9CDD4 transparent}\n.tbl-scroll::-webkit-scrollbar{height:8px}\n.tbl-scroll::-webkit-scrollbar-thumb{background:#C9CDD4;border-radius:4px}\n.tbl-scroll table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}\n.tbl-scroll th[data-col=\"op\"],.tbl-scroll td[data-col=\"op\"]{position:sticky;right:0;z-index:2;background:#fff;box-shadow:-8px 0 8px -8px rgba(29,33,41,.16)}\n.tbl-scroll th[data-col=\"op\"]{z-index:3;background:#FAFBFC}\n.tbl-scroll tr:hover td[data-col=\"op\"]{background:#F7F8FA}\nth{padding:11px 16px;font-size:12px;font-weight:500;color:var(--tx3);text-align:left;background:#FAFBFC;border-bottom:1px solid var(--bd);white-space:nowrap;overflow:hidden}\ntd{padding:13px 16px;font-size:13px;border-bottom:1px solid #F2F3F5;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\ntr:last-child td{border-bottom:none}\ntr:hover td{background:#F7F8FA}\ntr{cursor:pointer;transition:background .12s}\n.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:var(--radius-sm);font-size:12px;white-space:nowrap;line-height:20px}\n.tag-success{background:var(--success-bg);color:var(--success)}\n.tag-warning{background:var(--warning-bg);color:var(--warning)}\n.tag-danger{background:var(--danger-bg);color:var(--danger)}\n.tag-info{background:var(--info-bg);color:var(--info)}\n.tag-neutral{background:#F2F3F5;color:#1D2129}\n.tag-purple{background:var(--purple-bg);color:var(--purple)}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 16px;height:32px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);transition:all .15s;font-family:inherit}\n.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--primary-soft)}\n.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 1px 2px rgba(22,93,255,.2)}\n.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;box-shadow:0 2px 6px rgba(14,66,210,.25)}\n.btn-sm{padding:0 10px;height:28px;font-size:12px}\n.btn-link{border:none;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:12px;height:auto}\n.btn-link:hover{text-decoration:underline;background:none}\n.watermark{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9999;background-image:repeating-linear-gradient(30deg,transparent,transparent 200px,rgba(201,205,212,.06) 200px,rgba(201,205,212,.06) 201px),repeating-linear-gradient(150deg,transparent,transparent 200px,rgba(201,205,212,.06) 200px,rgba(201,205,212,.06) 201px)}\n.filter-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;background:var(--bg3);border-bottom:1px solid var(--bd)}\n.filter-row label{font-size:12px;color:var(--tx3);white-space:nowrap}\n.filter-row select,.filter-row input[type=\"date\"]{padding:5px 12px;height:32px;border:1px solid var(--bd);border-radius:var(--radius-sm);font-size:13px;color:var(--tx);background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s}\n.filter-row select:focus,.filter-row input[type=\"date\"]:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--primary-soft)}\n.filter-row .sep{color:var(--tx4);font-size:12px}\n.filter-hint{padding:8px 18px;font-size:12px;color:var(--accent);background:var(--info-bg);border-bottom:1px solid var(--bd);display:none}\n.filter-hint.show{display:block}\n/* 事件列表卡片样式 */\n.event-list{padding:0 20px}\n.event-item{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #F2F3F5;cursor:pointer;transition:background .15s,border-radius .15s}\n.event-item:hover{background:var(--bg3);margin:0 -12px;padding:14px 12px;border-radius:8px}\n.event-item:last-child{border-bottom:none}\n.event-star{width:32px;text-align:center;font-size:18px;color:var(--warning);flex-shrink:0}\n.event-star.empty{color:var(--tx3)}\n.event-source{width:90px;flex-shrink:0;font-size:13px;color:var(--tx)}\n.event-main{flex:1;min-width:0}\n.event-main .event-title{font-size:14px;font-weight:500;color:var(--tx);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.event-main .event-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}\n.event-main .event-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;white-space:nowrap}\n.event-main .event-tag.level1{background:#E8F3FF;color:#1677FF}\n.event-main .event-tag.level2{background:#E8F7ED;color:#00B42A}\n.event-main .event-tag.level3{background:#FFF4E5;color:#FF7D00}\n.event-main .event-tag.source{background:#F2F3F5;color:#1D2129}\n.event-meta{display:flex;align-items:center;gap:24px;flex-shrink:0}\n.event-meta .meta-item{font-size:12px;color:var(--tx2);white-space:nowrap}\n.event-meta .meta-item .meta-label{margin-right:4px}\n.event-id{width:160px;flex-shrink:0;font-size:12px;color:var(--tx2);font-family:monospace}\n.event-op{flex-shrink:0}\n/* ==================== 右侧抽屉 (5.4完整版) ==================== */\n.drawer-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:none;animation:fadeIn .2s}\n.drawer-mask.show{display:block}\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n.drawer{position:fixed;top:0;right:0;bottom:0;width:75%;background:var(--bg);z-index:201;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12)}\n.drawer.show{transform:translateX(0)}\n\n/* Drawer top bar */\n.drawer-top{padding:0 16px;height:48px;border-bottom:1px solid #E5E6EB;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:5}\n.drawer-top .left{display:flex;align-items:center;gap:8px}\n.drawer-top .left .ev-id{font-size:16px;font-weight:600;color:#333333}\n.drawer-top .left .star-btn{cursor:pointer;font-size:20px;width:20px;height:20px;color:#999999;transition:all .2s;user-select:none;display:inline-flex;align-items:center;justify-content:center}\n.drawer-top .left .star-btn.active{color:#FFD700}\n.drawer-top .left .star-btn:hover{transform:scale(1.15)}\n.drawer-top .left .status-tag{margin-left:24px;display:inline-flex;align-items:center;padding:6px 12px;border-radius:20px;font-size:14px;font-weight:400;background:#FFF1E8;color:#FF7D29}\n.drawer-top .right-btns{display:flex;align-items:center;gap:8px}\n.drawer-top .right-btns .action-btn{height:32px;border-radius:4px;border:1px solid #E5E6EB;background:#fff;color:#333;font-size:14px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit;transition:all .15s}\n.drawer-top .right-btns .action-btn .btn-icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}\n.drawer-top .right-btns .action-btn:hover{border-color:#C9CDD4;background:#F7F8FA}\n.drawer-top .right-btns .close-btn{height:32px;border-radius:4px;border:1px solid #FFECEC;background:#FFF1F0;color:#F53F3F;font-size:14px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit;transition:all .15s}\n.drawer-top .right-btns .close-btn:hover{background:#F53F3F;color:#fff}\n\n/* Drawer body: 左右分栏 */\n.drawer-body{display:flex;min-height:calc(100vh - 48px)}\n.drawer-left{flex:0 0 50%;border-right:1px solid #E5E6EB;min-width:0}\n.drawer-right{flex:0 0 50%;min-width:0;overflow-y:auto}\n\n/* Tabs inside drawer */\n.drawer-tabs{display:flex;gap:0;border-bottom:1px solid #E5E6EB;padding:0 4px;background:#fff;align-items:center}\n.drawer-tab{padding:8px 12px;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent;transition:all .15s;user-select:none;font-weight:400;white-space:nowrap;flex-shrink:0}\n.drawer-tab:hover{color:#333}\n.drawer-tab.on{color:#165DFF;font-weight:500;border-bottom-color:#165DFF}\n.tab-pane{display:none}\n.tab-pane.visible{display:block}\n\n/* 左侧 - 基本信息 */\n.info-section{padding:16px}\n.info-section .sec-title{font-size:14px;color:#333;font-weight:500;margin-bottom:12px;margin-top:20px}\n.info-section .sec-title:first-child{margin-top:0}\n.info-row{display:flex;padding:0 0 12px 24px;font-size:14px;line-height:22px}\n.info-row .k{width:auto;color:#666;flex-shrink:0;margin-right:8px}\n.info-row .v{color:#333;flex:1}\n.event-content{padding:0 0 16px;font-size:14px;line-height:22px;color:#333}\n.event-content .lbl{font-size:14px;color:#333;font-weight:500;margin-bottom:8px}\n.load-fail-box{background:#F5F5F5;border-radius:4px;padding:12px;text-align:center;font-size:12px;color:#999;margin:12px 0}\n.map-box{width:82%;max-width:460px;height:auto;border-radius:4px;border:1px solid #E5E6EB;margin-top:20px;background:#F5F5F5;overflow:hidden;padding:0}\n.map-box img{width:100%;height:auto;display:block}\n\n/* 左侧 - 详细信息 */\n.detail-content{padding:16px}\n.detail-section{margin-bottom:20px}\n.detail-section-title{display:inline-block;padding:4px 12px;background:var(--info-bg);color:var(--info);font-size:13px;font-weight:500;border-radius:var(--radius);margin-bottom:16px}\n.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;padding:0 4px}\n.detail-field{display:flex;align-items:baseline;gap:0;font-size:14px;line-height:1.8}\n.detail-field .field-label{color:#666;white-space:nowrap;flex-shrink:0}\n.detail-field .field-value{color:#333;font-weight:400}\n.detail-field.full{grid-column:1 / -1}\n\n/* 左侧 - AI分析 */\n.ai-tab-pane{padding:16px 20px}\n.ai-block{margin-bottom:20px}\n.ai-block:last-child{margin-bottom:0}\n.ai-block-title{font-size:13px;font-weight:600;color:#333;margin-bottom:10px;display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:1px solid #E5E6EB}\n.ai-block-title .ai-icon{font-size:14px}\n.ai-block-title .ai-badge{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--purple-bg);color:var(--purple);font-weight:400;margin-left:4px}\n.risk-item{display:flex;gap:8px;margin-bottom:8px;padding:10px 12px;border-radius:4px;font-size:13px;line-height:1.7}\n.risk-item.high{background:var(--danger-bg);border-left:3px solid var(--danger)}\n.risk-item.medium{background:var(--warning-bg);border-left:3px solid var(--warning)}\n.risk-item.low{background:var(--success-bg);border-left:3px solid var(--success)}\n.risk-item .risk-level{font-size:11px;font-weight:600;flex-shrink:0;padding:1px 6px;border-radius:8px;white-space:nowrap;height:fit-content;margin-top:2px}\n.risk-item.high .risk-level{background:var(--danger);color:#fff}\n.risk-item.medium .risk-level{background:var(--warning);color:#fff}\n.risk-item.low .risk-level{background:var(--success);color:#fff}\n.risk-item .risk-text{flex:1;color:#333}\n.risk-item .case-link{color:var(--accent);cursor:pointer;text-decoration:u ist{padding:4px 14px 12px;border-top:1px solid #EEEEEE}\n.opinion-list .opinion-title{font-size:13px;font-weight:500;color:#333;margin-bottom:8px;display:flex;align-items:center;gap:6px}\n.opinion-item{border:1px solid #E5E6EB;border-radius:4px;padding:8px 10px;margin-bottom:6px}\n.opinion-item .op-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}\n.opinion-item .op-dept{font-size:13px;font-weight:500}\n.opinion-item .op-time{font-size:12px;color:var(--tx2)}\n.opinion-item .op-text{font-size:13px;color:#333;line-height:1.7;background:var(--bg2);padding:8px 10px;border-radius:4px}\n\n/* 右侧 - 进度条 */\n.progress-track{background:#22C55E;border-radius:40px;padding:12px 18px 14px;margin:10px 12px 4px;display:block;position:relative}\n.progress-track .track-bar{display:flex;align-items:flex-start;justify-content:space-between;width:100%;position:relative;z-index:2}\n.progress-track .p-node{display:flex;flex-direction:column;align-items:center;flex:1;z-index:2;min-width:0;position:relative}\n.progress-track .p-node:not(:last-child)::after{content:'';position:absolute;top:10px;left:calc(50% + 15px);width:calc(100% - 30px);height:2px;background:rgba(255,255,255,.85);z-index:1;pointer-events:none}\n.progress-track .p-node .circle{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative;z-index:3;border:2px solid #fff;flex-shrink:0;margin-bottom:4px;background:transparent;color:#fff}\n.progress-track .p-node.done .circle{background:transparent;color:#fff}\n.progress-track .p-node.active .circle,.progress-track .p-node.closed .circle{background:#FF7A1A;color:#fff;border-color:#fff}\n.progress-track .p-node.pending .circle{background:rgba(255,255,255,.28);color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.55)}\n.progress-track .p-node .n-label{font-size:13px;color:#fff;margin-bottom:2px;white-space:nowrap;font-weight:600;text-align:center}\n.progress-track .p-node .n-time{font-size:11px;color:rgba(255,255,255,.95);line-height:1.35;text-align:center;font-weight:400}\n.progress-track .p-node.pending .n-time{opacity:.75}\n.progress-track .p-line{display:none}\n\n/* 右侧 - 时效评价 */\n.time-eval{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 12px 10px;border:none}\n.time-eval .duration{display:flex;align-items:center;gap:6px;margin-bottom:4px}\n.time-eval .duration .label{color:#1D2129;font-size:14px;font-weight:400}\n.time-eval .duration .value{font-size:14px;font-weight:600;color:#22C55E}\n.time-eval .satisfaction{display:flex;align-items:center;font-size:13px}\n.time-eval .satisfaction .stars{display:flex;gap:4px}\n.time-eval .satisfaction .stars .star{font-size:16px;color:#FFB700;cursor:default}\n.time-eval .satisfaction .stars .star.empty{color:#E5E6EB}\n.time-eval .satisfaction .sat-text{color:#555;font-size:14px;font-weight:500;margin-left:12px}\n.time-eval .satisfaction .info-icon{width:18px;height:18px;border-radius:50%;background:#5093FF;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-style:italic;cursor:pointer;margin-left:6px}\n\n/* 右侧 - 纵向时间线 */\n.v-timeline{padding:4px 14px 10px}\n.v-timeline .t-item{display:flex;gap:0;padding-bottom:12px;position:relative;padding-left:18px}\n.v-timeline .t-item:last-child{padding-bottom:0}\n.v-timeline .t-item::before{content:'';position:absolute;left:3px;top:12px;bottom:0;width:1px;background:#E5E6EB}\n.v-timeline .t-item:last-child::before{display:none}\n.v-timeline .t-item .t-dot{width:8px;height:8px;border-radius:50%;background:#165DFF;flex-shrink:0;position:absolute;left:0;top:5px;z-index:1}\n.v-timeline .t-item .t-body{flex:1;margin-left:0}\n.v-timeline .t-item .t-unit{font-size:13px;font-weight:500;color:#165DFF;margin-bottom:2px}\n.v-timeline .t-item .t-dept-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:4px}\n.v-timeline .t-item .t-dept{font-size:13px;font-weight:500;c attach-empty{padding:18px 0;text-align:center;color:var(--tx3);font-size:13px}\n.attach-preview{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9600;display:none;align-items:center;justify-content:center;padding:24px}\n.attach-preview.show{display:flex}\n.attach-preview img{max-width:90vw;max-height:86vh;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.35)}\n\n/* 处置前后效果对比 */\n.compare-wrap{padding:16px}\n.compare-empty{padding:60px 24px;text-align:center;color:#666;font-size:14px}\n.compare-header{display:flex;border:1px solid #E5E6EB;border-radius:4px 4px 0 0;overflow:hidden;margin-bottom:-1px}\n.compare-header .c-cell{padding:10px 14px;font-size:13px;font-weight:500;text-align:center}\n.compare-header .c-label{background:#F7F8FA;color:#666;flex:0 0 100px;border-right:1px solid #E5E6EB}\n.compare-header .c-before{background:#FFF1E8;color:#FF7D29;flex:1;border-right:1px solid #E5E6EB}\n.compare-header .c-after{background:#E8F7ED;color:#00B42A;flex:1}\n.compare-row{display:flex;border:1px solid #E5E6EB;border-top:none;overflow:hidden}\n.compare-row:last-child{border-radius:0 0 4px 4px}\n.compare-row .c-cell{padding:10px 14px;font-size:13px;line-height:1.6}\n.compare-row .c-label{background:#F7F8FA;color:#86909C;flex:0 0 100px;border-right:1px solid #E5E6EB;text-align:center}\n.compare-row .c-before{flex:1;border-right:1px solid #E5E6EB;color:#333}\n.compare-row .c-after{flex:1;color:#333}\n\n/* Score detail */\n.score-factor{display:flex;align-items:center;gap:10px;margin-bottom:10px}\n.score-factor .name{width:100px;font-size:13px;color:var(--tx2);flex-shrink:0}\n.score-factor .bar{flex:1}\n.progress-bar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}\n.progress-bar .fill{height:100%;border-radius:4px;transition:width .4s ease}\n.score-factor .val{width:50px;font-size:13px;text-align:right;color:var(--tx);font-weight:500;flex-shrink:0}\n\n/* Case list */\n.case-card{border:1px solid var(--bd);border-radius:var(--radius);padding:10px ed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:5000;opacity:0;visibility:hidden;transition:all .3s}\n.drawer-overlay.show{opacity:1;visibility:visible}\n/* Pagination */\n.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;font-size:13px;color:var(--tx2);border-top:1px solid var(--bd)}\n.pagination .page-btn{padding:4px 12px;border:1px solid var(--bd);border-radius:var(--radius);cursor:pointer;background:var(--bg);font-size:13px;transition:all .15s}\n.pagination .page-btn:hover{border-color:var(--accent);color:var(--accent)}\n.pagination .page-btn.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}\n.pagination .page-info{margin-right:8px}\n/* Keyword edit modal */\n.keyword-list{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}\n.keyword-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);font-size:12px}\n.keyword-chip .remove{cursor:pointer;color:var(--tx3);font-weight:700;transition:color .15s}\n.keyword-chip .remove:hover{color:var(--danger)}\n.keyword-input-row{display:flex;gap:8px;margin-top:8px}\n.keyword-input-row input{flex:1;padding:6px 12px;border:1px solid var(--bd);border-radius:var(--radius);font-size:13px;outline:none}\n.keyword-input-row input:focus{border-color:var(--accent)}\n/* Correct modal */\n.correct-form .form-group{margin-bottom:16px}\n.correct-form .form-label{font-size:13px;color:var(--tx2);margin-bottom:6px;display:block}\n.correct-form .form-value{font-size:13px;padding:8px 12px;background:var(--bg2);border-radius:var(--radius);margin-bottom:4px}\n.correct-form select,.correct-form textarea{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:var(--radius);font-size:13px;outline:none;font-family:inherit}\n.correct-form select:focus,.correct-form textarea:focus{border-color:var(--accent)}\n.correct-form textarea{resize:vertical;min-height:80px}\n\n/* NLP Pipelin .classList.remove('show');\n}\n\nfunction toggleDrawerStar(){\n  if(!currentEvent)return;\n  drawerStarred[currentEvent.id] = !drawerStarred[currentEvent.id];\n  var btn = document.getElementById('drawerStar');\n  btn.textContent = drawerStarred[currentEvent.id] ? '★' : '☆';\n  btn.className = drawerStarred[currentEvent.id] ? 'star-btn active' : 'star-btn';\n  showToast(drawerStarred[currentEvent.id]?'已添加关注':'已取消关注',drawerStarred[currentEvent.id]?'success':'info');\n}\n\nfunction switchLeftTab(idx){\n  document.querySelectorAll('#leftTabs .drawer-tab').forEach(function(t,i){t.classList.toggle('on',i===idx)});\n  for(var i=0;i<2;i++){var p=document.getElementById('leftPane'+i);if(p)p.classList.toggle('visible',i===idx)}\n}\n\nfunction switchRightTab(idx){\n  document.querySelectorAll('#rightTabs .drawer-tab').forEach(function(t,i){t.classList.toggle('on',i===idx)});\n  for(var i=0;i<3;i++){var p=document.getElementById('rightPane'+i);if(p)p.classList.toggle('visible',i===idx)}\n  if(idx===2) renderRightAI(currentDrawerEvent);\n}\n\nfunction renderLeftBasic(ev){\n  var h = '<div class=\"info-section\">';\n  h += '<div class=\"sec-title\">事件类型标签一览<\/div>';\n  ev.infoRows.forEach(function(r){h+='<div class=\"info-row\"><span class=\"k\">'+r[0]+'<\/span><span class=\"v\">'+r[1]+'<\/span><\/div>'});\n  h += '<div class=\"info-row\"><span class=\"k\">事件群体类型<\/span><span class=\"v\">' + (ev.group || '未分类') + '<\/span><\/div>';\n  h += '<div class=\"info-row\"><span class=\"k\">新就业群体事件分类<\/span><span class=\"v\">' + groupEventClass(ev) + '<\/span><\/div>';\n  h += '<div style=\"padding:4px 0 8px\"><button class=\"btn btn-sm\" onclick=\"openCorrectModal()\" style=\"border-color:var(--primary);color:var(--primary)\"><svg class=\"svg-icon svg-icon-16\" style=\"width:14px;height:14px;vertical-align:-0.15em\"><use href=\"#icon-edit\"/><\/svg> 修正<\/button><\/div>';\n  h += '<div class=\"sec-title\">内容<\/div>';\n  h += '<div class=\"event-content\">'+ev.desc+'<\/div>';\n  h += '<div class=\"map-box\"><img src=\"'+attachSrc('event-map.jpg')+'\" alt=\"事发位置\"><\/div>';\n  h += '<\/div>';\n  document.getElementById('leftPane0').innerHTML = h;\n}\n\nfunction renderLeftDetail(ev){\n  var h = '<div class=\"detail-content\">';\n  // 事件基本信息\n  h += '<div class=\"detail-section\">';\n  h += '<div class=\"detail-section-title\">事件基本信息<\/div>';\n  h += '<div class=\"detail-grid\">';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">事件名称：<\/span><span class=\"field-value\">' + pick(ev.desc,'事件详情') + '<\/span><\/div>';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">事件类型：<\/span><span class=\"field-value\">' + typePathOf(ev) + '<\/span><\/div>';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">事项名称：<\/span><span class=\"field-value\">' + pick(ev.aiTag,ev.level3,ev.group,'新就业群体诉求') + '事项<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">事发时间：<\/span><span class=\"field-value\">' + pick(ev.time,'2026-07-03') + '<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">所属组织：<\/span><span class=\"field-value\">' + pick(ev.org,'承办单位') + '<\/span><\/div>';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">事发地点：<\/span><span class=\"field-value\">' + locTextOf(ev) + '<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">紧急程度：<\/span><span class=\"field-value\">' + ((ev.status === '紧急' || String(ev.category||ev.type||'').indexOf('紧急')>=0) ? '紧急' : '非紧急') + '<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">事件来源：<\/span><span class=\"field-value\">' + pick(ev.source,'12345') + '<\/span><\/div>';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">协同应用系统：<\/span><span class=\"field-value\">浙江省基层治理四平台<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">重点事件：<\/span><span class=\"field-value\">' + ((ev.category === '重点事件' "field-label\">上报时间：<\/span><span class=\"field-value\">' + pick(ev.time,'2026-07-03') + '<\/span><\/div>';\n  h += '<\/div><\/div>';\n  h += '<\/div>';\n  document.getElementById('leftPane1').innerHTML = h;\n}\n\nfunction renderLeftInspection(ev){\n  var html = '<div style=\"padding:16px;text-align:center;color:#999;font-size:14px\">暂无抽检记录<\/div>';\n  document.getElementById('leftPane2').innerHTML = html;\n}\n\nfunction renderLeftAI(ev){\n  var h = '<div class=\"ai-tab-pane\">';\n  // AI分析子Tab\n  h += '<div class=\"ai-sub-tabs\" style=\"display:flex;gap:0;border-bottom:1px solid #E5E6EB;margin-bottom:16px;padding:0 4px\">';\n  h += '<div class=\"ai-sub-tab on\" data-ait=\"0\" onclick=\"switchAITab(0)\" style=\"padding:8px 16px;font-size:13px;cursor:pointer;color:#165DFF;font-weight:500;border-bottom:2px solid #165DFF;white-space:nowrap\">风险研判<\/div>';\n  h += '<div class=\"ai-sub-tab\" data-ait=\"1\" onclick=\"switchAITab(1)\" style=\"padding:8px 16px;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent;white-space:nowrap\">研判结论<\/div>';\n  h += '<div class=\"ai-sub-tab\" data-ait=\"2\" onclick=\"switchAITab(2)\" style=\"padding:8px 16px;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent;white-space:nowrap\">处置建议<\/div>';\n  h += '<div class=\"ai-sub-tab\" data-ait=\"3\" onclick=\"switchAITab(3)\" style=\"padding:8px 16px;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent;white-space:nowrap\">风险评估依据<\/div>';\n  h += '<\/div>';\n  // Tab内容区\n  h += '<div id=\"aiPane0\">';\n  if(ev.riskItems && ev.riskItems.length>0){\n    ev.riskItems.forEach(function(r){\n      h += '<div class=\"risk-item '+r.cls+'\"><span class=\"risk-level\">'+r.level+'<\/span><span class=\"risk-text\">'+r.text;\n      if(r.hasCase){h += '<span class=\"case-link\" onclick=\"showCases()\">查看先行案例<\/span>'}\n      h += '<\/span><\/div>';\n    });\n  } else {\n    h += '<div style=\"padding:20px;text-align:center;color:#999\">暂无风险研判数据<\/div>';\n  }\n  h += '<\/div>';\n  h += '<div id=\"aiPane1\" style=\"display:none\">';\n  if(ev.conclusion && ev.conclusion!=='待AI分析'){\n    h += '<div class=\"ai-conclusion\">'+ev.conclusion+'<\/div>';\n  } else {\n    h += '<div style=\"padding:20px;text-align:center;color:#999\">暂无研判结论<\/div>';\n  }\n  h += '<\/div>';\n  h += '<div id=\"aiPane2\" style=\"display:none\">';\n  if(ev.suggestions && ev.suggestions.length>0){\n    ev.suggestions.forEach(function(s,i){\n      h += '<div class=\"suggestion-item\" id=\"sug_'+i+'\"><span class=\"sug-num\">'+(i+1)+'<\/span><span>'+s+'<\/span><span class=\"sug-actions\"><button class=\"btn-adopt\" onclick=\"adoptSugg('+i+',this)\">采纳<\/button><button class=\"btn-reject\" onclick=\"rejectSugg('+i+',this)\">不采纳<\/button><\/span><\/div>';\n    });\n  } else {\n    h += '<div style=\"padding:20px;text-align:center;color:#999\">暂无处置建议<\/div>';\n  }\n  h += '<\/div>';\n  h += '<div id=\"aiPane3\" style=\"display:none\">';\n  if(ev.legalRefs && ev.legalRefs.length>0){\n    ev.legalRefs.forEach(function(l){\n      h += '<div class=\"legal-item\"><div class=\"legal-name\">'+l.law+'<\/div><div class=\"legal-content\">'+l.content+'<\/div><\/div>';\n    });\n  } else {\n    h += '<div style=\"padding:20px;text-align:center;color:#999\">暂无风险评估依据<\/div>';\n  }\n  h += '<\/div>';\n  if((!ev.riskItems||ev.riskItems.length===0) && (!ev.suggestions||ev.suggestions.length===0) && (!ev.legalRefs||ev.legalRefs.length===0) && (!ev.conclusion||ev.conclusion==='待AI分析')){\n    h = '<div style=\"padding:40px 20px;text-align:center;color:#999;font-size:14px\"><div style=\"font-size:32px;margin-bottom:8px;color:#C9CDD4\"><svg class=\"svg-icon svg-icon-16\"><use href=\"#icon-robot\"/><\/svg><\/div>AI分析进行中，请稍候...<\/div>';\n  }\n  h += '<\/div>';\n  document.getElementById('aiDrawerContent').innerHTML = h;\n}\n\n// AI分析右侧抽屉\nfunction openAIDrawer(){\n  var ev = currentDrawerEvent;\n  if(!ev) { showToast('请先打开事件详情','warning'); return; }\n  renderLeftAI(ev);\n  document.getElementById('aiDrawerTitle').textContent = 'AI智能分析 - ' + ev.id;\n  document.getElementById('aiDrawerMask').classList.add('show');\n  document.getElementById('aiDrawer').classList.add('show');\n}\nfunction closeAIDrawer(){\n  document.getElementById('aiDrawerMask').classList.remove('show');\n  document.getElementById('aiDrawer').classList.remove('show');\n}\n\n// 修正分类弹窗\nfunction openCorrectModal(){\n  var ev = currentDrawerEvent;\n  if(!ev) return;\n  document.getElementById('correctGroup').value = ev.group || '';\n  document.getElementById('correctLevel').value = groupEventClass(ev);\n  document.getElementById('correctReason').value = '';\n  document.getElementById('correctMask').classList.add('show');\n  document.getElementById('correctModal').style.display = 'block';\n}\nfunction closeCorrectModal(){\n  document.getElementById('correctMask').classList.remove('show');\n  document.getElementById('correctModal').style.display = 'none';\n}\nfunction submitCorrect(){\n  var group = document.getElementById('correctGroup').value;\n  var level = document.getElementById('correctLevel').value;\n  var reason = document.getElementById('correctReason').value.trim();\n  if(!group){showToast('请选择事件群体类型','warning');return;}\n  if(!level){showToast('请选择新就业群体事件分类','warning');return;}\n  if(!reason){showToast('请填写修正理由','warning');return;}\n  // 更新当前事件数据\n  var ev = currentDrawerEvent;\n  if(ev){\n    ev.group = group;\n    applyGroupEventClass(ev, level);\n  }\n  // 更新allEvents中对应事件\n  for(var i=0;i<allEvents.length;i++){\n    if(allEvents[i].id === ev.id){\n      allEvents[i].group = group;\n      applyGroupEventClass(allEvents[i], level);\n      break;\n    }\n  }\n  closeCorrectModal();\n  renderLeftBasic(ev);\n  renderTable();\n  showToast('修正成功，群体类型：'+group+'，事件分类：'+level,'success');\n}\n\nfunction switchAITab(idx){\n  var tabs = document.querySelectorAll('.ai-sub-tab');\n  tabs.forEach(function(t,i){\n    t.classList.toggle('on',i===idx);\n    t. \n  for(var i=0;i<4;i++){var p=document.getElementById('rightAIPane'+i);if(p) p.style.display=i===idx?'block':'none'}\n}\n\n// ===== Modal helpers =====\nfunction showModal(title, bodyHtml, footerHtml){\n  closeAllModals();\n  var mask = document.createElement('div');\n  mask.className = 'modal-mask';\n  mask.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s';\n  mask.onclick = function(e){if(e.target===mask)closeAllModals()};\n  var h = '<div style=\"background:var(--bg);border-radius:8px;width:560px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)\">';\n  h += '<div style=\"padding:16px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;font-weight:500;font-size:15px\"><span>'+title+'<\/span><span style=\"cursor:pointer;font-size:18px;color:var(--tx2)\" onclick=\"closeAllModals()\">✕<\/span><\/div>';\n  h += '<div style=\"padding:20px 24px\">'+bodyHtml+'<\/div>';\n  if(footerHtml) h += '<div style=\"padding:12px 24px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px\">'+footerHtml+'<\/div>';\n  h += '<\/div>';\n  mask.innerHTML = h;\n  document.body.appendChild(mask);\n}\nfunction closeAllModals(){document.querySelectorAll('.modal-mask').forEach(function(m){if(m.style.zIndex==='9000')m.remove()})}\n\nfunction showAIClassify(){\n  if(!currentEvent) return;\n  var ac = currentEvent.aiClassify;\n  var h = '<div style=\"margin-bottom:14px\"><div style=\"font-size:12px;color:var(--tx2);margin-bottom:4px\">AI分类结果<\/div><div style=\"font-size:14px;font-weight:500\">'+ac.result+'<\/div><\/div>';\n  h += '<div style=\"margin-bottom:14px\"><div style=\"font-size:12px;color:var(--tx2);margin-bottom:4px\">综合置信度：'+ac.confidence+'%<\/div><div class=\"progress-bar\"><div class=\"fill\" style=\"width:'+ac.confidence+'%;background:var(--accent)\"><\/div><\/div><\/div>';\n  if(ac.keywords.length>0){\n    h += '<div style=\"margin-bottom:14px\"><div style=\"font-size:12px;color:var(--tx2);margin-bottom:6px\">关键词匹配<\/div>';\n    ac.keywords.forEach(function(k){\n      h += '<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px\"><span style=\"width:70px;font-size:12px\">'+k.k+'<\/span><div class=\"progress-bar\" style=\"flex:1\"><div class=\"fill\" style=\"width:'+k.v+'%;background:'+(k.v>=80?'var(--success)':k.v>=60?'var(--warning)':'var(--tx3)')+'\"><\/div><\/div><span style=\"font-size:11px;color:var(--tx2);width:32px;text-align:right\">'+k.v+'%<\/span><\/div>';\n    });\n    h += '<\/div>';\n  }\n  h += '<div><div style=\"font-size:12px;color:var(--tx2);margin-bottom:4px\">分类依据<\/div><div style=\"font-size:12px;line-height:1.7;color:var(--tx);background:var(--bg2);padding:8px 12px;border-radius:var(--radius)\">'+ac.basis+'<\/div><\/div>';\n  showModal('AI分类建议详情', h);\n}\n\nfunction showScoreDetail(){\n  if(!currentEvent)return;\n  var sd = currentEvent.scoreDetail;\n  var h = '';\n  sd.factors.forEach(function(f){\n    var pct = (f.val/f.max*100).toFixed(0);\n    var color = pct>=80?'var(--danger)':pct>=50?'var(--warning)':'var(--success)';\n    h += '<div class=\"score-factor\"><span class=\"name\">'+f.name+'<\/span><div class=\"bar\"><div class=\"progress-bar\"><div class=\"fill\" style=\"width:'+pct+'%;background:'+color+'\"><\/div><\/div><\/div><span class=\"val\" style=\"color:'+color+'\">'+f.val+'/'+f.max+'<\/span><\/div>';\n  });\n  h += '<div style=\"border-top:1px solid var(--bd);padding-top:10px;margin-top:6px;display:flex;align-items:center;justify-content:space-between\"><span style=\"font-weight:500;font-size:13px\">综合评分<\/span><span style=\"font-size:18px;font-weight:600;color:'+currentEvent.scoreColor+'\">'+currentEvent.score+'/100<\/span><\/div>';\n  showModal('风险评分详情', h);\n}\n\nfunction showCases(){\n  var h = '';\n  CASES.forEach(function(c,i){\n    var statusCls = c.status==='已办结'?'tag-success':'tag-warning';\n    h += '<div class=\"case-card\"><div class=\"case-title\">案例'+(i+1)+'：'+c.title+'<\/div><div class=\"case-meta\">'+c.time+' <span class=\"tag '+statusCls+'\" style=\"margin-left:4px\">'+c.status+'<\/span><\/div><div class=\"case-plan\">'+c.plan+'<\/div><\/div>';\n  });\n  showModal('先行案例详情（3起）', h);\n}\n\nfunction adoptSugg(idx, btn){\n  var item = document.getElementById('sug_'+idx);\n  var actions = item.querySelector('.sug-actions');\n  var adoptBtn = actions.querySelector('.btn-adopt');\n  var rejectBtn = actions.querySelector('.btn-reject');\n  if(adoptBtn.classList.contains('adopted')||rejectBtn.classList.contains('rejected')) return;\n  adoptBtn.classList.add('adopted');adoptBtn.textContent='已采纳';rejectBtn.style.display='none';\n  showToast('已采纳建议，将同步至处置方案','success');\n}\nfunction rejectSugg(idx, btn){\n  var h = '<div style=\"margin-bottom:14px\"><label style=\"display:block;font-size:13px;color:var(--tx);margin-bottom:5px;font-weight:500\">请说明不采纳原因<\/label><textarea id=\"rejectReason\" placeholder=\"请输入不采纳原因...\" style=\"width:100%;min-height:80px;padding:8px 12px;border:1px solid var(--bd);border-radius:var(--radius);font-size:13px;resize:vertical;font-family:inherit\"><\/textarea><\/div>';\n  showModal('不采纳反馈', h, '<button class=\"btn\" onclick=\"closeAllModals()\">取消<\/button><button class=\"btn btn-primary\" onclick=\"submitReject('+idx+')\">提交反馈<\/button>');\n}\nfunction submitReject(idx){\n  var item = document.getElementById('sug_'+idx);\n  var actions = item.querySelector('.sug-actions');\n  actions.querySelector('.btn-adopt').style.display='none';\n  var rejectBtn = actions.querySelector('.btn-reject');\n  rejectBtn.classList.add('rejected');rejectBtn.textContent='已反馈';\n  closeAllModals();showToast('反馈已记录，AI将持续优化','info');\n}\n\nfunction showCollabForm(){\n  var h = '<div style=\"margin-bottom:14px\"><label style=\"display:block;font-size:13px;color:var(--tx);margin-bottom:5px;font-weight:500\">协同部门<\/label><select style=\"width:100%;padding:7px 12px;border:1px solid var(--bd);border-radius:var(--radius);font-size:13px\"><option>请选择协同部门<\/option><option>市场监管局<\/option><option>人社局<\/option><option>交通局<\/option><option>信访局<\/option><option>综合行政执法局<\/option><option>建设局<\/option><\/select><\/div>';\n  h += '<div style=\"margin-bottom:14px\"><label style=\"display:block;font-size:13px;color:var(--tx);margin-bottom:5px;font-weight:500\">协同事项<\/label><input type=\"text\" placeholder=\"请输入协同事项说明\" style=\"width:100%;padding:7px 12px;border:1px solid var(--bd);border-radius:var(--radius);font-size:13px\"><\/div>';\n  h += '<div style=\"margin-bottom:14px\"><label style=\"display:block;font-size:13px;color:var(--tx);margin-bottom:5px;font-weight:500\">办理期限<\/label><input type=\"date\" value=\"2026-07-10\" style=\"width:100%;padding:7px 12px;border:1px solid var(--bd);border-radius:var(--radius);font-size:13px\"><\/div>';\n  h += '<div style=\"margin-bottom:14px\"><label style=\"display:block;font-size:13px;color:var(--tx);margin-bottom:5px;font-weight:500\">协同要求<\/label><textarea placeholder=\"请输入对协同部门的具体要求...\" style=\"width:100%;min-height:80px;padding:8px 12px;border:1px solid var(--bd);border-radius:var(--radius);font-size:13px;resize:vertical;font-family:inherit\"><\/textarea><\/div>';\n  showModal('发起协同', h, '<button class=\"btn\" onclick=\"closeAllModals()\">取消<\/button><button class=\"btn btn-primary\" onclick=\"submitCollab()\">确认发起<\/button>');\n}\nfunction submitCollab(){closeAllModals();showToast('协同发起成功，已通知相关部门','success')}\n\n// ===== 表格渲染 (与5.3一致) =====\nfunction renderTable() {\n  var tbody = document.getElementById('tableBody');\n  var start = (currentPage - 1) * PAGE_SIZE;\n  var pageData = filteredEvents.slice(start, start + PAGE_SIZE);\n  var html = '';\n  pageData.forEach(function(ev) {\n    html += '<tr onclick=\"openDetail(\\''+ev.id+'\\')\">';\n    if (isColumnVisible('source')) html += '<td>'+ev.source+'<\/td>';\n    if (isColumnVisible('name')) html += '<td style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+ev.desc+'<\/td>';\n    if (isColumnVisible('id')) html += '<td>'+ev.id+'<\/td>';\n    if (isColumnVisible('provinceCode')) html += '<td>'+ev.provinceCode+'<\/td>';\n    if (isColumnVisible('level1')) html += '<td>'+ev.level1+'<\/td>';\n    if (isColumnVisible('level2')) html += '<td>'+ev.level2+'<\/td>';\n    if (isColumnVisible('level3')) html += '<td>'+ev.level3+'<\/td>';\n    if (isColumnVisible('desc')) html += '<td style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+ev.desc+'<\/td>';\n    if (isColumnVisible('op')) html += '<td data-col=\"op\"><span class=\"btn-link\" onclick=\"event.stopPropagation();openDrawer(\\''+ev.id+'\\')\">查看<\/span><\/td>';\n    html += '<\/tr>';\n  });\n  tbody.innerHTML = html;\n  renderPagination();\n}\n\nfunction renderPagination() {\n  var total = filteredEvents.length;\n  var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));\n  if (currentPage > totalPages) currentPage = totalPages;\n  var pg = document.getElementById('pagination');\n  pg.innerHTML = '<span class=\"page-info\">共 '+total+' 条<\/span>' +\n    '<span class=\"page-info\">当前第 '+currentPage+' / '+totalPages+' 页<\/span>' +\n    '<button class=\"page-btn'+(currentPage<=1?' disabled':'')+'\" onclick=\"goPage('+(currentPage-1)+')\">&lsaquo; 上一页<\/button>' +\n    '<button class=\"page-btn'+(currentPage>=totalPages?' disabled':'')+'\" onclick=\"goPage('+(currentPage+1)+')\">下一页 &rsaquo;<\/button>';\n}\n\nfunction goPage(p) {\n  var totalPages = Math.max(1, Math.ceil(filteredEvents.length / PAGE_SIZE));\n  if (p < 1 || p > totalPages) return;\n  currentPage = p;\n  renderTable();\n}\n\nfunction openDetail(id) {\n  openDrawer(id);\n}\n\nrenderTable();\n<\/script>\n<\/body>\n<\/html>","p53":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>\"e拨就灵\" - 全量事件管理<\/title>\n<style>\n:root{\n  --primary:#165DFF;--primary-dark:#0E42D2;--primary-light:#4080FF;--primary-soft:#E8F3FF;\n  --accent:#165DFF;--bg:#FFFFFF;--bg2:#F2F3F5;--bg3:#F7F8FA;\n  --tx:#1D2129;--tx2:#4E5969;--tx3:#86909C;--tx4:#C9CDD4;--bd:#E5E6EB;\n  --success:#00B42A;--success-bg:#E8FFEA;--warning:#FF7D00;--warning-bg:#FFF7E8;\n  --danger:#F53F3F;--danger-bg:#FFECE8;--info:#165DFF;--info-bg:#E8F3FF;\n  --purple:#722ED1;--purple-bg:#F5E8FF;\n  --radius:8px;--radius-sm:4px;--shadow:0 1px 2px rgba(0,0,0,.04);--shadow-md:0 4px 12px rgba(0,0,0,.06);\n  --top:52px;--side:220px\n}\n*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;color:var(--tx);background:var(--bg2);line-height:1.5;-webkit-font-smoothing:antialiased}\n::selection{background:var(--primary-soft);color:var(--tx)}\n/* —— Top nav —— */\n.topnav{height:var(--top);background:linear-gradient(90deg,#0B4BD6 0%,#165DFF 42%,#2B7AF0 100%);display:flex;align-items:center;padding:0 20px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 2px 8px rgba(11,75,214,.18)}\n.topnav::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 60%);pointer-events:none}\n.topnav .logo{color:#fff;font-size:16px;font-weight:600;letter-spacing:.3px;white-space:nowrap;display:flex;align-items:center;gap:4px;position:relative;z-index:1;flex-shrink:0}\n.topnav .logo .site-name{font-size:15px;font-weight:600}\n.topnav .logo .sep{width:1px;height:14px;background:rgba(255,255,255,.35);margin:0 10px;flex-shrink:0}\n.topnav .logo .sys-name{font-size:13px;font-weight:400;opacity:.88}\n.topnav .menus{display:flex;gap:0;margin-left:16px;position:relative;z-index:1;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;align-self:stretch}\n.topnav .menus::-webkit-scrollbar{display:none}\n.topnav .menus a{color:rgba(255,255,255,.82);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;font-size:13px;position:relative;transition:color .15s,background .15s;white-space:nowrap;flex-shrink:0}\n.topnav .menus a:hover{color:#fff;background:rgba(255,255,255,.1)}\n.topnav .menus a.on{color:#fff;font-weight:500;background:rgba(255,255,255,.14)}\n.topnav .menus a.on::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:3px;background:#fff;border-radius:3px 3px 0 0;box-shadow:0 0 8px rgba(255,255,255,.45)}\n.topnav .right{margin-left:auto;display:flex;align-items:center;gap:0;position:relative;z-index:1;flex-shrink:0;padding-right:2px}\n.topnav .right .nav-icon{color:rgba(255,255,255,.92);cursor:pointer;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;transition:background .2s;opacity:.92;flex-shrink:0}\n.topnav .right .nav-icon:hover{background:rgba(255,255,255,.14);opacity:1}\n.topnav .right .user-info{color:#fff;font-size:13px;font-weight:400;display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .15s;white-space:nowrap;line-height:1.2}\n.topnav .right .user-info:hover{background:rgba(255,255,255,.12)}\n.topnav .right .user-info .arrow{display:inline-block;width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4px solid rgba(255,255,255,.85);flex-shrink:0;opacity:.9}\n/* —— Sidebar —— */\n.sidebar{width:var(--side);position:fixed;top:var(--top);left:0;bottom:0;background:var(--bg);border-right:1px solid var(--bd);overflow-y:auto;z-index:90;padding:12px 10px;box-shadow:1px 0 0 rgba(0,0,0,.02)}\n.sidebar::-webkit-scrollbar{width:4px}\n.sidebar::-webkit-scrollbar-thumb{background:var(--tx4);border-radius:4px}\n.sidebar .menu-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;color:var(--tx2);font-size:14px;transition:all .15s;text-decoration:none;border-left:none;border-radius:8px;position:relative;margin-bottom:2px}\n.sidebar .menu-item:hover{background:var(--bg2);color:var(--tx)}\n.sidebar .menu-item.on{color:var(--accent);font-weight:500;background:var(--primary-soft)}\n.sidebar .menu-item .icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:transform .15s}\n.sidebar .menu-item:hover .icon{transform:scale(1.04)}\n.sidebar .menu-item .arrow{margin-left:auto;font-size:11px;color:var(--tx3);transition:transform .2s,color .15s;flex-shrink:0;opacity:.7}\n.sidebar .menu-item:hover .arrow{color:var(--tx2);opacity:1}\n.sidebar .menu-item.expanded .arrow{transform:rotate(180deg)}\n.sidebar .menu-item:not(.expanded) .sub-menu{max-height:0;opacity:0}\n.sidebar .sub-menu{padding:2px 0 6px 0;overflow:hidden;transition:max-height .2s ease,opacity .15s}\n.sidebar .sub-menu .sub-item{display:flex;align-items:center;padding:9px 12px 9px 50px;cursor:pointer;color:var(--tx3);font-size:13px;transition:all .15s;text-decoration:none;border-left:none;border-radius:8px;margin:1px 0;position:relative}\n.sidebar .sub-menu .sub-item::before{content:'';position:absolute;left:28px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--tx4);transform:translateY(-50%);transition:all .15s}\n.sidebar .sub-menu .sub-item:hover{color:var(--accent);background:var(--bg2)}\n.sidebar .sub-menu .sub-item:hover::before{background:var(--accent)}\n.sidebar .sub-menu .sub-item.on{color:var(--accent);font-weight:500;background:var(--primary-soft)}\n.sidebar .sub-menu .sub-item.on::before{background:var(--accent);box-shadow:0 0 0 3px rgba(22,93,255,.15)}\n.sidebar .menu-item.menu-group{cursor:default;color:var(--tx);font-weight:500;margin-top:6px}\n.sidebar .menu-item.menu-group:hover{background:transparent;color:var(--tx)}\n.sidebar .menu-item.menu-group:hover .icon{transform:none}\n.sidebar .sub-menu.always-open{max-height:none !important;opacity:1 !important;overflow:visible;padding:2px 0 8px}\n/* —— Main —— */\n.main{margin-left:var(--side);margin-top:var(--top);padding:20px 24px 40px;min-height:calc(100vh - var(--top));background:var(--bg2)}\n@media (max-width:1440px){\n  .main{padding:16px 16px 32px}\n  .card-header{flex-wrap:wrap;gap:8px}\n  .filter-form-row{flex-wrap:wrap}\n  .filter-field{flex:1 1 220px;min-width:200px}\n}\n@media (min-width:1920px){\n  .main{padding:24px 32px 48px}\n}\n.breadcrumb{font-size:12px;color:var(--tx3);margin-bottom:14px;display:flex;align-items:center;gap:6px}\n.breadcrumb b{color:var(--tx);font-weight:500}\n.section-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--tx)}\n.section-title::before{content:'';width:3px;height:15px;background:linear-gradient(180deg,var(--primary-light),var(--primary));border-radius:2px;flex-shrink:0}\n/* Filter Bar - 5.2 style */\n.filter-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;background:var(--bg3);border-bottom:1px solid var(--bd)}\n.filter-row label{font-size:12px;color:var(--tx3);white-space:nowrap}\n.filter-row select,.filter-row input[type=\"date\"]{padding:5px 12px;height:32px;border:1px solid var(--bd);border-radius:var(--radius-sm);font-size:13px;color:var(--tx);background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s}\n.filter-row select:focus,.filter-row input[type=\"date\"]:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--primary-soft)}\n.filter-row .sep{color:var(--tx4);font-size:12px}\n.filter-hint{padding:8px 18px;font-size:12px;color:var(--accent);background:var(--info-bg);border-bottom:1px solid var(--bd);display:none}\n.filter-hint.show{display:block}\n/* Filter Form - New Design */\n.filter-form{background:var(--bg);padding:20px;border-bottom:1px solid var(--bd)}\n.filter-form-row{display:flex;gap:16px;align-items:center;margin-bottom:16px}\n.filter-form-row:last-child{margin-bottom:0}\n.filter-field{display:flex;align-items:center;gap:8px;flex:1}\n.filter-field .field-label{font-size:13px;color:var(--tx2);white-space:nowrap;min-width:60px}\n.filter-field input,.filter-field select{flex:1;height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:var(--radius);font-size:13px;color:var(--tx);background:var(--bg);outline:none}\n.filter-field input:focus,.filter-field select:focus{border-color:var(--primary)}\n.filter-field input::placeholder{color:var(--tx3)}\n.filter-btns{display:flex;gap:8px;flex-shrink:0}\n.more-filters{border-top:1px solid var(--bd);padding-top:16px;margin-top:8px;display:none}\n.more-filters.show{display:block}\n.more-filters .section-label{font-size:13px;color:var(--tx);font-weight:500;margin-bottom:8px}\n.checkbox-group{display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}\n.checkbox-group label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--tx);cursor:pointer}\n.checkbox-group label input{accent-color:var(--primary)}\n.selected-tags{margin-bottom:12px;min-height:20px}\n.selected-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:var(--info-bg);color:var(--primary);font-size:12px;border-radius:var(--radius);margin-right:8px;margin-bottom:4px;cursor:pointer}\n.selected-tag:hover{opacity:.7}\n.btn-row-between{padding:12px 20px;display:flex;justify-content:space-between;align-items:center}\n/* Checkbox label style */\n.chk-label{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--tx);cursor:pointer;white-space:nowrap}\n.chk-label input[type=\"checkbox\"]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}\n/* Tag Tabs - 标签式筛选 */\n.tag-tabs{display:flex;gap:0;border-bottom:1px solid var(--bd);background:var(--bg);padding:0 4px;margin-bottom:0}\n.tag-tab{padding:12px 20px;font-size:14px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;transition:all .15s;user-select:none;white-space:nowrap;display:flex;align-items:center;gap:6px}\n.tag-tab:hover{color:var(--tx)}\n.tag-tab.on{color:var(--accent);font-weight:500;border-bottom-color:var(--accent)}\n.count-pill{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;line-height:18px;font-weight:500}\n/* Card */\n.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}\n.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#fff,#FAFBFC)}\n.card-header .title{font-size:15px;font-weight:600}\n/* Table */\ntable{width:100%;border-collapse:collapse}\n.tbl-scroll{overflow-x:auto;max-width:100%;scrollbar-width:thin;scrollbar-color:#C9CDD4 transparent}\n.tbl-scroll::-webkit-scrollbar{height:8px}\n.tbl-scroll::-webkit-scrollbar-thumb{background:#C9CDD4;border-radius:4px}\n.tbl-scroll table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}\n.tbl-scroll th[data-col=\"op\"],.tbl-scroll td[data-col=\"op\"]{position:sticky;right:0;z-index:2;background:#fff;box-shadow:-8px 0 8px -8px rgba(29,33,41,.16)}\n.tbl-scroll th[data-col=\"op\"]{z-index:3;background:#FAFBFC}\n.tbl-scroll tr:hover td[data-col=\"op\"]{background:#F7F8FA}\nth{padding:11px 16px;font-size:12px;font-weight:500;color:var(--tx3);text-align:left;background:#FAFBFC;border-bottom:1px solid var(--bd);white-space:nowrap;overflow:hidden}\ntd{padding:13px 16px;font-size:13px;border-bottom:1px solid #F2F3F5;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\ntr:last-child td{border-bottom:none}\ntr:hover td{background:#F7F8FA}\ntr{cursor:pointer;transition:background .12s}\n.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:var(--radius-sm);font-size:12px;white-space:nowrap;line-height:20px}\n.tag-success{background:var(--success-bg);color:var(--success)}\n.tag-warning{background:var(--warning-bg);color:var(--warning)}\n.tag-danger{background:var(--danger-bg);color:var(--danger)}\n.tag-info{background:var(--info-bg);color:var(--info)}\n.tag-neutral{background:#F2F3F5;color:#1D2129}\n.tag-purple{background:var(--purple-bg);color:var(--purple)}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 16px;height:32px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);transition:all .15s;font-family:inherit}\n.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--primary-soft)}\n.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 1px 2px rgba(22,93,255,.2)}\n.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;box-shadow:0 2px 6px rgba(14,66,210,.25)}\n.btn-sm{padding:0 10px;height:28px;font-size:12px}\n.btn-link{border:none;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:12px;height:auto}\n.btn-link:hover{text-decoration:underline;background:none}\n/* ==================== 右侧抽屉 ==================== */\n.drawer-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:none;animation:fadeIn .2s}\n.drawer-mask.show{display:block}\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n.drawer{position:fixed;top:0;right:0;bottom:0;width:75%;background:var(--bg);z-index:201;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12)}\n.drawer.show{transform:translateX(0)}\n\n/* Drawer top bar - 截图精确还原 */\n.drawer-top{padding:0 16px;height:48px;border-bottom:1px solid #E5E6EB;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:5}\n.drawer-top .left{display:flex;align-items:center;gap:8px}\n.drawer-top .left .ev-id{font-size:16px;font-weight:600;color:#333333}\n.drawer-top .left .star-btn{cursor:pointer;font-size:20px;width:20px;height:20px;color:#999999;transition:all .2s;user-select:none;display:inline-flex;align-items:center;justify-content:center}\n.drawer-top .left .star-btn.active{color:#FFD700}\n.drawer-top .left .star-btn:hover{transform:scale(1.15)}\n.drawer-top .left .status-tag{margin-left:24px;display:inline-flex;align-items:center;padding:6px 12px;border-radius:20px;font-size:14px;font-weight:400;background:#FFF1E8;color:#FF7D29}\n.drawer-top .right-btns{display:flex;align-items:center;gap:8px}\n.drawer-top .right-btns .action-btn{height:32px;border-radius:4px;border:1px solid #E5E6EB;background:#fff;color:#333;font-size:14px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit;transition:all .15s}\n.drawer-top .right-btns .action-btn .btn-icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}\n.drawer-top .right-btns .action-btn:hover{border-color:#C9CDD4;background:#F7F8FA}\n.drawer-top .right-btns .close-btn{height:32px;border-radius:4px;border:1px solid #FFECEC;background:#FFF1F0;color:#F53F3F;font-size:14px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit;transition:all .15s}\n.drawer-top .right-btns .close-btn:hover{background:#F53F3F;color:#fff}\n\n/* Drawer body: 左右分栏 - 截图还原50/50 */\n.drawer-body{display:flex;min-height:calc(100vh - 48px)}\n.drawer-left{flex:0 0 50%;border-right:1px solid #E5E6EB;min-width:0}\n.drawer-right{flex:0 0 50%;min-width:0;overflow-y:auto}\n\n/* Tabs inside drawer - 截图还原 */\n.drawer-tabs{display:flex;gap:0;border-bottom:1px solid #E5E6EB;padding:0 4px;background:#fff;align-items:center}\n.drawer-tab{padding:8px 12px;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent;transition:all .15s;user-select:none;font-weight:400;white-space:nowrap;flex-shrink:0}\n.drawer-tab:hover{color:#333}\n.drawer-tab.on{color:#165DFF;font-weight:500;border-bottom-color:#165DFF}\n.tab-pane{display:none}\n.tab-pane.visible{display:block}\n\n/* 左侧 - 基本信息 - 截图还原 */\n.info-section{padding:16px}\n.info-section .sec-title{font-size:14px;color:#333;font-weight:500;margin-bottom:12px;margin-top:20px}\n.info-section .sec-title:first-child{margin-top:0}\n.info-row{display:flex;padding:0 0 12px 24px;font-size:14px;line-height:22px}\n.info-row .k{width:auto;color:#666;flex-shrink:0;margin-right:8px}\n.info-row .v{color:#333;flex:1}\n.event-content{padding:0 0 16px;font-size:14px;line-height:22px;color:#333}\n.event-content .lbl{font-size:14px;color:#333;font-weight:500;margin-bottom:8px}\n.load-fail-box{background:#F5F5F5;border-radius:4px;padding:12px;text-align:center;font-size:12px;color:#999;margin:12px 0}\n.map-box{width:82%;max-width:460px;height:auto;border-radius:4px;border:1px solid #E5E6EB;margin-top:20px;background:#F5F5F5;overflow:hidden;padding:0}\n.map-box img{width:100%;height:auto;display:block}\n\n/* 左侧 - 详细信息 */\n.detail-content{padding:16px}\n.detail-section{margin-bottom:20px}\n.detail-section-title{display:inline-block;padding:4px 12px;background:var(--info-bg);color:var(--info);font-size:13px;font-weight:500;border-radius:var(--radius);margin-bottom:16px}\n.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;padding:0 4px}\n.detail-field{display:flex;align-items:baseline;gap:0;font-size:14px;line-height:1.8}\n.detail-field .field-label{color:#666;white-space:nowrap;flex-shrink:0}\n.detail-field .field-value{color:#333;font-weight:400}\n.detail-field.full{grid-column:1 / -1}\n\n/* 左侧 - 抽检记录 (替代原AI分析) */\n.ai-section{padding:16px 20px}\n\n/* 左侧 - AI分析 */\n.ai-tab-pane{padding:16px 20px}\n.ai-block{margin-bottom:20px}\n.ai-block:last-child{margin-bottom:0}\n.ai-block-title{font-size:13px;font-weight:600;color:#333;margin-bottom:10px;display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:1px solid #E5E6EB}\n.ai-block-title .ai-icon{font-size:14px}\n.ai-block-title .ai-badge{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--purple-bg);color:var(--purple);font-weight:400;margin-left:4px}\n.risk-item{display:flex;gap:8px;margin-bottom:8px;padding:10px 12px;border-radius:4px;font-size:13px;line-height:1.7}\n.risk-item.high{background:var(--danger-bg);border-left:3px solid var(--danger)}\n.risk-item.medium{background:var(--warning-bg);border-left:3px solid var(--warning)}\n.risk-item.low{background:var(--success-bg);border-left:3px solid var(--success)}\n.risk-item .risk-level{font-size:11px;font-weight:600;flex-shrink:0;padding:1px 6px;border-radius:8px;white-space:nowrap;height:fit-content;margin-top:2px}\n.risk-item.high .risk-level{background:var(--danger);color:#fff}\n.risk-item.medium .risk-level{background:var(--warning);color:#fff}\n.risk-item.low .risk-level{background:var(--success);color:#fff}\n.risk-item .risk-text{flex:1;color:#333}\n.risk-item .case-link{color:var(--accent);cursor:pointer;text-decoration:underline;font-size:12px;margin-left:4px}\n.ai-conclusion{background:var(--info-bg);border-left:3px solid var(--accent);padding:12px 14px;border-radius:4px;font-size:13px;line-height:1.7;color:#333;margin-bottom:12px}\n.suggestion-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;padding:10px 12px;background:var(--bg2);border-radius:4px;font-size:13px;line-height:1.7;color:#333}\n.suggestion-item .sug-num{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}\n.suggestion-item .sug-actions{display:flex;gap:6px;margin-left:auto;flex-shrink:0}\n.suggestion-item .sug-actions button{font-size:11px;padding:2px 8px;border-radius:3px;border:1px solid var(--bd);background:#fff;cursor:pointer;color:#666;transition:all .15s}\n.suggestion-item .sug-actions .btn-adopt:hover{border-color:var(--success);color:var(--success)}\n.suggestion-item .sug-actions .btn-adopt.adopted{background:var(--success);color:#fff;border-color:var(--success)}\n.suggestion-item .sug-actions .btn-reject:hover{border-color:var(--danger);color:var(--danger)}\n.suggestion-item .sug-actions .btn-reject.rejected{background:var(--tx3);color:#fff;border-color:var(--tx3)}\n.legal-item{margin-bottom:8px;padding:10px 12px;border:1px solid var(--bd);border-radius:4px}\n.legal-item .legal-name{font-size:13px;font-weight:500;color:#333;margin-bottom:4px}\n.legal-item .legal-content{font-size:12px;color:var(--tx2);line-height:1.7}\n.flow-chain{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:8px}\n.flow-chain .flow-node{font-size:12px;padding:4px 10px;border-radius:4px;background:var(--bg3);color:#666}\n.flow-chain .flow-node.done{background:var(--success-bg);color:var(--success)}\n.flow-chain .flow-node.active{background:var(--warning-bg);color:var(--warning);font-weight:500}\n.flow-chain .flow-arrow{font-size:12px;color:var(--tx3)}\n\n/* 办理意见详情 */\n.opinion-list{padding:4px 14px 12px;border-top:1px solid #EEEEEE}\n.opinion-list .opinion-title{font-size:13px;font-weight:500;color:#333;margin-bottom:8px;display:flex;align-items:center;gap:6px}\n.opinion-item{border:1px solid #E5E6EB;border-radius:4px;padding:8px 10px;margin-bottom:6px}\n.opinion-item .op-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}\n.opinion-item .op-dept{font-size:13px;font-weight:500}\n.opinion-item .op-time{font-size:12px;color:var(--tx2)}\n.opinion-item .op-text{font-size:13px;color:#333;line-height:1.7;background:var(--bg2);padding:8px 10px;border-radius:4px}\n\n/* 右侧 - 进度条 */\n.progress-track{background:#22C55E;border-radius:40px;padding:12px 18px 14px;margin:10px 12px 4px;display:block;position:relative}\n.progress-track .track-bar{display:flex;align-items:flex-start;justify-content:space-between;width:100%;position:relative;z-index:2}\n.progress-track .p-node{display:flex;flex-direction:column;align-items:center;flex:1;z-index:2;min-width:0;position:relative}\n.progress-track .p-node:not(:last-child)::after{content:'';position:absolute;top:10px;left:calc( (String(loc).indexOf('金华')===0) return '浙江省'+loc;\n  return '浙江省金华市'+loc;\n}\nvar GROUP_EVENT_CLASSES = ['一般事件','重点事件-紧急事件','重点事件-敏感事件','重点事件-多跨协同事件','其他事件'];\nfunction normalizeClassText(s){\n  return String(s||'').replace(/\\s+/g,'');\n}\nfunction groupEventClass(ev){\n  ev = ev || {};\n  var cands = [ev.category, ev.type, ev.controlLevel];\n  var i, j, n;\n  for(i=0;i<cands.length;i++){\n    n = normalizeClassText(cands[i]);\n    for(j=0;j<GROUP_EVENT_CLASSES.length;j++){\n      if(n === GROUP_EVENT_CLASSES[j]) return GROUP_EVENT_CLASSES[j];\n    }\n  }\n  var blob = normalizeClassText((ev.category||'')+' '+(ev.type||'')+' '+(ev.controlLevel||''));\n  if(blob.indexOf('紧急')>=0) return '重点事件-紧急事件';\n  if(blob.indexOf('敏感')>=0) return '重点事件-敏感事件';\n  if(blob.indexOf('多跨')>=0) return '重点事件-多跨协同事件';\n  if(blob.indexOf('其他')>=0) return '其他事件';\n  if(blob.indexOf('重大管控')>=0) return '重点事件-紧急事件';\n  if(blob.indexOf('较大管控')>=0) return '重点事件-敏感事件';\n  if(blob.indexOf('一般管控')>=0 || blob.indexOf('一般')>=0) return '一般事件';\n  if(blob.indexOf('重点')>=0) return '重点事件-敏感事件';\n  return '一般事件';\n}\nfunction applyGroupEventClass(ev, level){\n  if(!ev) return;\n  ev.category = level;\n  ev.controlLevel = level;\n  if(level === '其他事件') ev.type = '其他事件';\n  else if(String(level).indexOf('重点事件')===0) ev.type = '重点事件';\n  else ev.type = '一般事件';\n}\nfunction hydrateDrawerEvent(ev){\n  if(!ev) return ev;\n  var src=(typeof allEvents!=='undefined' && ev.id)?allEvents.find(function(e){return e.id===ev.id}):null;\n  if(src){\n    ev.level1=pick(ev.level1,src.level1);\n    ev.level2=pick(ev.level2,src.level2);\n    ev.level3=pick(ev.level3,src.level3);\n    ev.location=pick(ev.location,src.location);\n    ev.aiTag=pick(ev.aiTag,src.aiTag);\n    ev.reporter=pick(ev.reporter,src.reporter);\n    ev.group=pick(ev.group,src.group);\n    ev.org=pick(ev.org,src.org);\n    ev.source=pick(ev.source,src.source);\n    ev.category=pick(ev.category,src.category);\n    ev.handleTime=pick(ev.handleTime,src.handleTime);\n    ev.desc=pick(ev.desc,src.desc);\n    ev.time=pick(ev.time,src.time);\n    ev.provinceCode=pick(ev.provinceCode,src.provinceCode);\n  }\n  if(isBlank(ev.level1)&&ev.classify){\n    var p=String(ev.classify).split(/[-／/]/);\n    ev.level1=pick(ev.level1,p[0]);\n    ev.level2=pick(ev.level2,p[1]);\n    ev.level3=pick(ev.level3,p[2]);\n  }\n  ev.location=pick(ev.location,'婺城区');\n  ev.org=pick(ev.org,'承办单位');\n  ev.source=pick(ev.source,'12345');\n  ev.group=pick(ev.group,'新就业群体');\n  ev.aiTag=pick(ev.aiTag,ev.level3,ev.group,'民生诉求');\n  ev.reporter=pick(ev.reporter,'张建国');\n  ev.category=pick(ev.category,ev.type,'一般事件');\n  applyGroupEventClass(ev, groupEventClass(ev));\n  ev.handleTime=pick(ev.handleTime,ev.status==='已办结'?'已办结':'5个工作日');\n  ev.phone=pick(ev.phone,phoneFromId(ev.id));\n  if(ev.collabRows){\n    ev.collabRows=ev.collabRows.map(function(r){\n      if(r[0]==='协同单号'&&isBlank(r[1])) return ['协同单号',collabCodeOf(ev)];\n      if(r[0]==='关联事件'&&isBlank(r[1])) return ['关联事件','无关联事件'];\n      if(r[0]==='第三方单号'&&isBlank(r[1])) return ['第三方单号',ev.provinceCode||ev.id];\n      return r;\n    });\n  }\n  if(ev.infoRows){\n    ev.infoRows=ev.infoRows.map(function(r){\n      if(r[0]==='事件标签'&&isBlank(r[1])) return [r[0],ev.category||ev.aiTag||'民生诉求'];\n      if(r[0]==='事件标识'&&isBlank(r[1])) return [r[0],(ev.category||'一般事件')+'-'+(ev.aiTag||'民生诉求')];\n      return r;\n    });\n  }\n  if(ev.trackItems){\n    ev.trackItems.forEach(function(t){\n      if(isBlank(t.org)) t.org=ev.org;\n      if(isBlank(t.dept)) t.dept='办公室';\n      if(isBlank(t.time)) t.time=ev.time||'2026-07-03';\n      if(isBlank(t.user)) t.user='经办人';\n    });\n  }\n  if(ev.progressNodes){\n    ev.progressNodes.forEach(function(n){\n      if(n.status==='pending'&&isBlank(n.time)) n.time=(n.label==='结案'?'未办结':'待办理');\n      if(isBlank(n.dept)&&n.status!=='pending') n.dept=ev.org;\n    });\n  }\n  fillClosedAttachments(ev);\n  return ev;\n}\n\n// 抽屉详情相关\n// ===== 打开抽屉 =====\nfunction openDrawer(id){\n  const ev = hydrateDrawerEvent(EVENTS[id] || getDefaultEvent(id));\n  currentEvent = ev;\n  currentDrawerEvent = ev;\n\n  document.getElementById('drawerEvId').textContent = ev.id;\n  const statusEl = document.getElementById('drawerStatus');\n  statusEl.textContent = ev.status;\n  // 动态状态标签样式\n  const statusMap = {'办理中':'background:#FFF1E8;color:#FF7D29','舆情监控中':'background:#FFF1E8;color:#FF7D29','紧急处置中':'background:#FFECE8;color:#F53F3F','已办结':'background:#E8F7ED;color:#00B42A','网格结案':'background:#FFF2E8;color:#FA8C16'};\n  statusEl.style.cssText = statusMap[ev.status] || 'background:#FFF1E8;color:#FF7D29';\n\n  const starBtn = document.getElementById('drawerStar');\n  const isStarred = drawerStarred[id] !== undefined ? drawerStarred[id] : false;\n  starBtn.textContent = isStarred ? '★' : '☆';\n  starBtn.className = isStarred ? 'star-btn active' : 'star-btn';\n\n  // Reset tabs\n  switchLeftTab(0);\n  switchRightTab(0);\n  // 右栏只有2个tab，更新切换逻辑\n\n  currentDrawerEvent = ev;\n  renderLeftBasic(ev);\n  renderLeftDetail(ev);\n  renderRightTrack(ev);\n  renderRightAttach(ev);\n\n  document.getElementById('drawerMask').classList.add('show');\n  document.getElementById('drawer').classList.add('show');\n}\n\nfunction closeDrawer(){\n  document.getElementById('drawerMask').classList.remove('show');\n  document.getElementById('drawer').classList.remove('show');\n}\n\nfunction toggleDrawerStar(){\n  if(!currentEvent)return;\n  drawerStarred[currentEvent.id] = !drawerStarred[currentEvent.id];\n  const btn = document.getElementById('drawerStar');\n  btn.textContent = drawerStarred[currentEvent.id] ? '★' : '☆';\n  btn.className = drawerStarred[currentEvent.id] ? 'star-btn active' : 'star-btn';\n  // Sync with list\n  const listStar = document.querySelector('.star-col[data-id=\"'+currentEvent.id+'\"]');\n  if(listStar){\n    const row = LIST_DATA.find(function(r){return r.id===currentEvent.id});\n    if(row){row.star=drawerStarred[currentEvent.id]}\n    listStar.textContent = drawerStarred[currentEvent.id]?'★':'☆';\n    listStar.className = drawerStarred[currentEvent.id]?'star-col active':'star-col';\n  }\n  showToast(drawerStarred[currentEvent.id]?'已添加关注':'已取消关注',drawerStarred[currentEvent.id]?'success':'info');\n}\n\n// ===== Left Tab =====\nfunction switchLeftTab(idx){\n  document.querySelectorAll('#leftTabs .drawer-tab').forEach(function(t,i){t.classList.toggle('on',i===idx)});\n  for(let i=0;i<2;i++){var p=document.getElementById('leftPane'+i);if(p)p.classList.toggle('visible',i===idx)}\n}\n\n// ===== Right Tab =====(3 tabs)\nfunction switchRightTab(idx){\n  document.querySelectorAll('#rightTabs .drawer-tab').forEach(function(t,i){t.classList.toggle('on',i===idx)});\n  for(let i=0;i<3;i++){document.getElementById('rightPane'+i).classList.toggle('visible',i===idx)}\n  if(idx===2) renderRightAI(currentDrawerEvent);\n}\n\n// ===== 左侧 - 基本信息 - 截图还原 =====\nfunction renderLeftBasic(ev){\n  var h = '<div class=\"info-section\">';\n  h += '<div class=\"sec-title\">事件类型标签一览<\/div>';\n  ev.infoRows.forEach(function(r){h+='<div class=\"info-row\"><span class=\"k\">'+r[0]+'<\/span><span class=\"v\">'+r[1]+'<\/span><\/div>'});\n  h += '<div class=\"info-row\"><span class=\"k\">事件群体类型<\/span><span class=\"v\">' + (ev.group || '未分类') + '<\/span><\/div>';\n  h += '<div class=\"info-row\"><span class=\"k\">新就业群体事件分类<\/span><span class=\"v\">' + groupEventClass(ev) + '<\/span><\/div>';\n  h += '<div style=\"padding:4px 0 8px\"><button class=\"btn btn-sm\" onclick=\"openCorrectModal()\" style=\"border-color:var(--primary);color:var(--primary)\"><svg class=\"svg-icon svg-icon-16\" style=\"width:14px;height:14px;vertical-align:-0.15em\"><use href=\"#icon-edit\"/><\/svg> 修正<\/button><\/div>';\n  h += '<div class=\"sec-title\">内容<\/div>';\n  h += '<div class=\"event-content\">'+ev.desc+'<\/div>';\n  h += '<div class=\"map-box\"><img src=\"'+attachSrc('event-map.jpg')+'\" alt=\"事发位置\"><\/div>';\n  h += '<\/div>';\n  document.getElementById('leftPane0').innerHTML = h;\n}\n\n// ===== 左侧 - 详细信息 =====\nfunction renderLeftDetail(ev){\n  var h = '<div class=\"detail-content\">';\n  // 事件基本信息\n  h += '<div class=\"detail-section\">';\n  h += '<div class=\"detail-section-title\">事件基本信息<\/div>';\n  h += '<div class=\"detail-grid\">';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">事件名称：<\/span><span class=\"field-value\">' + pick(ev.desc,'事件详情') + '<\/span><\/div>';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">事件类型：<\/span><span class=\"field-value\">' + typePathOf(ev) + '<\/span><\/div>';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">事项名称：<\/span><span class=\"field-value\">' + pick(ev.aiTag,ev.level3,ev.group,'新就业群体诉求') + '事项<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">事发时间：<\/span><span class=\"field-value\">' + pick(ev.time,'2026-07-03') + '<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">所属组织：<\/span><span class=\"field-value\">' + pick(ev.org,'承办单位') + '<\/span><\/div>';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">事发地点：<\/span><span class=\"field-value\">' + locTextOf(ev) + '<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">紧急程度：<\/span><span class=\"field-value\">' + ((ev.status === '紧急' || String(ev.category||ev.type||'').indexOf('紧急')>=0) ? '紧急' : '非紧急') + '<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">事件来源：<\/span><span class=\"field-value\">' + pick(ev.source,'12345') + '<\/span><\/div>';\n  h += '<div class=\"detail-field full\"><span class=\"field-label\">协同应用系统：<\/span><span class=\"field-value\">浙江省基层治理四平台<\/span><\/div>';\n  h += '<div class=\"detail-field\"><span class=\"field-label\">重点事件：<\/span><span class=\"field-value\">' + ((ev.category === '重点事件' || (ev.category && ev.category.indexOf('重点事件') === 0)) ? '是' : '否') + '<\/span><\/div>';\n  h += '<div class=\"detail-
